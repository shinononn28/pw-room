  // characters
  if (q('[data-import]')) { importDialog(room, ru); return true; }
  if ((el = q('[data-editchar]'))) { importDialog(room, ru, el.dataset.editchar); return true; }
  if ((el = q('[data-formchange]'))) { const cid = el.dataset.formchange; act({ type: 'variation', cid, idx: +el.dataset.idx }); delete ui.formView[cid]; return true; }
  if ((el = q('[data-givechar]'))) {
    const cid = el.dataset.givechar, to = $('giveTo').value; if (!to) { toast('譲渡先を選んでください'); return true; }
    const toName = to === 'gm' ? 'GM' : room.players[to].name;
    ask(`${room.chars[cid].data.name}を${toName}に譲渡します。譲渡したキャラは取り戻せません（相手から譲渡してもらう必要があります）。`, '譲渡する', () => act({ type: 'giveChar', cid, to }));
    return true;
  }
  if ((el = q('[data-colorpick]'))) { const c = room.chars[el.dataset.colorpick]; colorDialog(c.color, col => act({ type: 'setColor', cid: c.id, color: col })); return true; }
  if ((el = q('[data-sheetopen]'))) { openModal('sheet', el.dataset.sheetopen); return true; }
  if ((el = q('[data-portraits]'))) { portraitDialog(room, el.dataset.portraits); return true; }
  if ((el = q('[data-delchar]'))) { const c = room.chars[el.dataset.delchar]; ask(`${c.data.name}を部屋から外します。手札は捨て札に移ります。`, 'キャラクターを外す', () => act({ type: 'removeChar', cid: c.id }), true); return true; }
  if ((el = q('[data-vstep]'))) { stepValue(room, el.dataset.cid, el.dataset.key, +el.dataset.vstep); return true; }

  if (q('[data-opensettings]')) { settingsDialog(room); return true; }
  return false;
}

function stepZoom(d) {
  const i = ZOOMS.indexOf(zoomOf());
  U.zoom = d === 0 ? 1 : ZOOMS[Math.max(0, Math.min(ZOOMS.length - 1, i + d))];
  saveU(); renderRoom();
}
// drag the line between the board side and the chat to resize (wide screens)
document.addEventListener('pointerdown', e => {
  const bar = e.target.closest('#vsplit'); if (!bar) return;
  e.preventDefault();
  const shell = $('roomShell'), rect = shell.getBoundingClientRect();
  bar.setPointerCapture(e.pointerId); bar.classList.add('on');
  const move = ev => {
    const w = Math.round(Math.max(340, Math.min(rect.width - 480, rect.right - ev.clientX)));
    shell.style.setProperty('--chatW', w + 'px'); U.chatW = w;
  };
  const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); bar.classList.remove('on'); saveU(); };
  bar.addEventListener('pointermove', move); bar.addEventListener('pointerup', up);
});
document.addEventListener('dblclick', e => { if (e.target.closest('#vsplit')) { U.chatW = null; saveU(); $('roomShell').style.setProperty('--chatW', ''); } });
// tab arrows
document.addEventListener('click', e => {
  const b = e.target.closest('#tabL, #tabR'); if (!b) return;
  $('tabs').scrollBy({ left: b.id === 'tabL' ? -160 : 160, behavior: 'smooth' });
  setTimeout(updateTabArrows, 350);
});
document.addEventListener('scroll', e => { if (e.target && e.target.id === 'tabs') updateTabArrows(); }, true);
window.addEventListener('resize', () => updateTabArrows());
// crossing the phone width (rotation, resizing) switches between the two map layouts
matchMedia('(max-width:720px)').addEventListener('change', () => { if (curRoom()) renderRoom(); });

// drag the zoomed map to move around (no scrollbars); a drag never counts as a tap on a square
let panDrag = null;
document.addEventListener('pointerdown', e => {
  if (e.button !== 0 || e.pointerType === 'touch') return;          // touch scrolls natively
  const box = e.target.closest('#mapP .boardBox, dialog.mapDlg');
  if (!box || e.target.closest('.zoomV, .zoomCtl, .selbar, button:not(.tok), select, input')) return;
  if (box.scrollWidth <= box.clientWidth + 1 && box.scrollHeight <= box.clientHeight + 1) return;
  panDrag = { box, x: e.clientX, y: e.clientY, sl: box.scrollLeft, st: box.scrollTop, moved: false };
});
document.addEventListener('pointermove', e => {
  if (!panDrag) return;
  const dx = e.clientX - panDrag.x, dy = e.clientY - panDrag.y;
  if (!panDrag.moved && Math.hypot(dx, dy) < 6) return;
  panDrag.moved = true; panDrag.box.classList.add('panning');
  panDrag.box.scrollLeft = panDrag.sl - dx; panDrag.box.scrollTop = panDrag.st - dy;
});
document.addEventListener('pointerup', () => {
  if (!panDrag) return;
  const moved = panDrag.moved; panDrag.box.classList.remove('panning'); panDrag = null;
  if (moved) window.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); }, { capture: true, once: true });
});

// Ctrl (or ⌘) + wheel over the board zooms the map
document.addEventListener('wheel', e => {
  if (!(e.ctrlKey || e.metaKey) || !e.target.closest('.board')) return;
  e.preventDefault(); stepZoom(e.deltaY < 0 ? 1 : -1);
}, { passive: false });
// map interactions, shared by the page and the big map modal
function mapClick(t, room, ru) {
  const q = s => t.closest(s);
  let el;
  if ((el = q('[data-zoom]'))) { stepZoom(+el.dataset.zoom); return true; }
  if ((el = q('[data-autofx]'))) {
    const c = room.chars[el.dataset.autofx];
    autoFxDialog(c.data.name, detectEffects(c.data), c.autoFx || [], names => { act({ type: 'setAutoFx', cid: c.id, names }); openModal('char', c.id); });
    return true;
  }
  if ((el = q('[data-setsize]'))) { const c = room.chars[el.dataset.setsize]; act({ type: 'setSize', cid: c.id, size: sizeOf(c) > 1 ? 1 : 2 }); return true; }
  if ((el = q('[data-clonechar]'))) { const nm = nextCopyName(room, room.chars[el.dataset.clonechar].data.name); if (act({ type: 'cloneChar', cid: el.dataset.clonechar }) !== FAIL) toast(`${nm}を追加しました（盤外）`); return true; }
  if ((el = q('[data-fxdel]'))) { act({ type: 'removeEffect', cid: el.dataset.cid, eid: el.dataset.fxdel }); return true; }
  if ((el = q('[data-fxadd]'))) {
    if (act({ type: 'addEffect', cid: el.dataset.fxadd, name: $('fxName').value, note: $('fxNote').value, dur: $('fxDur').value }) !== FAIL) ui.fxDraft = null;
    return true;
  }
  if ((el = q('[data-movechar]'))) { ui.selTok = el.dataset.movechar; closeDlg(); renderRoom(); if (isPhone()) $('board').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return true; }
  if ((el = q('[data-setturn]'))) { act({ type: 'setTurn', cid: el.dataset.setturn }); return true; }
  if (q('[data-nextturn]')) { ui.expectPick = true; act({ type: 'nextTurn' }); return true; }
  if (q('[data-roundmenu]')) { roundMenu(room); return true; }
  if (q('[data-pickmenu]')) { pickMenu(room, ru); return true; }
  if (q('[data-endround]')) { act({ type: 'endRound' }); return true; }
  if (q('[data-resetround]')) { ask('ラウンド数を1に戻し、SS値がいちばん大きいキャラの手番から始めます。', '戦闘を開始', () => act({ type: 'resetRound' })); return true; }
  // a selected token + a tap on an empty square = move there (a square holds one piece; tapping a piece selects it)
  if (ui.selTok && room.chars[ui.selTok] && canControlChar(room, ru.viewer, ui.selTok) && room.chars[ui.selTok].x != null) {
    const hit = (el = q('[data-tok]')) ? el.dataset.tok : (el = q('.cell.covered')) ? coverAt(room, el.dataset.cell) : null;
    if (hit && hit !== ui.selTok && room.chars[hit]) { collideDialog(room, ru, ui.selTok, hit); return true; }
  }
  if ((el = q('[data-cell]')) && ui.selTok && !q('[data-tok]')) {
    let [x, y] = el.dataset.cell.split(',').map(Number);
    // a giant goes with its top-left square on the tapped one, pulled back from the right / bottom edge
    const n = sizeOf(room.chars[ui.selTok]); x = Math.min(x, 8 - n); y = Math.min(y, 8 - n);
    if (act({ type: 'move', cid: ui.selTok, x, y }, { silent: true }) !== FAIL) ui.selTok = null;
    renderRoom(); return true;
  }
  if ((el = q('[data-tok]'))) { const id = el.dataset.tok; ui.selTok = ui.selTok === id ? null : id; renderRoom(); return true; }
  if (q('[data-offboard]')) { if (act({ type: 'move', cid: ui.selTok, x: null, y: null }, { silent: true }) !== FAIL) ui.selTok = null; renderRoom(); return true; }
  if (q('[data-unsel]')) { ui.selTok = null; renderRoom(); return true; }
  return false;
}

document.addEventListener('click', e => {
  const t = e.target, q = s => t.closest(s);
  const room = curRoom();
  let el;
  if ((el = q('[data-export]'))) { const r = DB.rooms[el.dataset.export]; download(`${r.name}.json`, JSON.stringify(r, null, 1)); return; }
  if ((el = q('[data-delroom]'))) { const r = DB.rooms[el.dataset.delroom]; ask(`「${r.name}」を削除します。ログもすべて消えます。`, '部屋を削除', () => { delete DB.rooms[r.id]; persist(); renderList(); }, true); return; }
  if (!room && (el = q('[data-forget]'))) { forgetRoom(el.dataset.forget); renderList(); return; }
  if (!room && q('[data-theme-toggle]')) { U.theme = (U.theme || 'dark') === 'dark' ? 'light' : 'dark'; saveU(); applyTheme(); return; }
  if (!room || !t.isConnected || t.closest('dialog')) return;
  const ru = roomUI(room.id);

  if ((el = q('[data-pickturn]'))) { act({ type: 'pickTurn', cid: el.dataset.pickturn }); return; }
  if (q('[data-pickmenu]')) { pickMenu(room, ru); return; }
  if (t.closest('[data-vstep],[data-setturn]') && t.closest('[data-charopen]')) { /* buttons inside the list row act, the row does not open */ }
  else if ((el = q('[data-charopen]'))) { openModal('char', el.dataset.charopen); return; }
  if (q('[data-weapon]')) { const hs = handSeat(room, ru); ui.w = { cid: isPcSeat(room, hs) ? hs : (room.turn.current && room.chars[room.turn.current]?.side === 'enemy' ? room.turn.current : null), weapons: [], cards: [...ui.sel], targets: [], memo: ui.memo }; openModal('weapon'); return; }
  if (q('[data-handsall]')) { openModal('hands'); return; }
  if (q('[data-deckmenu]')) { openModal('deck'); return; }
  if (q('[data-ordtoggle]')) { U.ordOpen = !U.ordOpen; saveU(); renderRoom(); return; }
  if (mapClick(t, room, ru)) return;

  if (commonClick(t, room, ru)) return;

  if (q('[data-opensettings]')) { settingsDialog(room); return; }
  if (q('[data-links]')) { linksDialog(room, ru); return; }
  if (q('[data-menu]')) { menuDialog(room); return; }
  if (q('[data-bgm]')) { if (BGM.blocked && BGM.info) { bgmEl().play().catch(() => {}); } bgmDialog(room, ru); return; }
  if (q('[data-theme-toggle]')) { U.theme = (U.theme || 'dark') === 'dark' ? 'light' : 'dark'; saveU(); applyTheme(); return; }
  if ((el = q('.mnav [data-pane]'))) {
    // each pane comes back where it was left (the chat pane never scrolls the page; the board pane does)
    ui.paneY = ui.paneY || {}; ui.paneY[ru.pane] = window.scrollY;
    ru.pane = el.dataset.pane; renderRoom();
    window.scrollTo(0, ui.paneY[ru.pane] || 0);
    if (ru.pane === 'chat') { const box = $('chatLog'); box.scrollTop = box.scrollHeight; }
    window.scrollTo(0, 0); return;
  }
  // chat
  if ((el = q('[data-replymsg]'))) {
    const l = room.logs.find(x => x.id === el.dataset.replymsg); if (!l) return;
    const vl = viewLog(room, l, ru.viewer, myPid()) || l;
    const body = vl.dice ? (vl.dice.hidden || vl.dice.secret ? 'シークレットダイス' : `${vl.dice.comment ? vl.dice.comment + ' ' : ''}${vl.dice.result}`) : vl.text;
    ui.reply = { id: l.id, tab: ru.tab, name: l.name || '', text: String(body || '').replace(/\s+/g, ' ').slice(0, 60) };
    document.querySelectorAll('#chatLog .msg.act').forEach(m => m.classList.remove('act'));
    renderRoom(); $('sayText').focus(); return;
  }
  if ((el = t.closest('#chatLog .msg')) && !t.closest('button,a,input,textarea,select')) {
    const was = el.classList.contains('act');
    document.querySelectorAll('#chatLog .msg.act').forEach(m => m.classList.remove('act'));
    if (!was) el.classList.add('act');
    return;
  }
  if ((el = q('[data-jump]'))) {
    const m = document.querySelector(`#chatLog [data-lid="${CSS.escape(el.dataset.jump)}"]`);
    if (!m) { toast('返信先の発言は、表示している範囲より前にあります'); return; }
    $('chatNotice').classList.remove('show');
    m.scrollIntoView({ block: 'center', behavior: 'smooth' });
    m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); return;
  }
  if ((el = q('[data-editmsg]'))) {
    const l = room.logs.find(x => x.id === el.dataset.editmsg); if (!l) return;
    openDlg(`<h1>発言を編集</h1><textarea id="edText" rows="6" style="width:100%">${esc(l.text)}</textarea>
      <div class="row" style="margin-top:12px"><span class="muted">編集すると「（編集済み）」と表示されます</span><span style="flex:1"></span><button class="btn" data-close>やめる</button><button class="btn primary" id="edOk">保存</button></div>`, () => {
      $('edOk').onclick = () => { if (act({ type: 'editSay', id: l.id, text: $('edText').value }) !== FAIL) closeDlg(); };
      $('edText').focus();
    });
    return;
  }
  if ((el = q('[data-tab]'))) { ru.tab = el.dataset.tab; renderRoom(); return; }
  if (q('[data-addtab]')) { tabDialog(room, ru); return; }
  if ((el = q('[data-edittab]'))) { tabDialog(room, ru, el.dataset.edittab); return; }
});
document.addEventListener('change', e => {
  const room = curRoom(); if (!room || !e.target.isConnected || e.target.closest('dialog')) return;
  const t = e.target;
  if (t.matches('[data-vset]')) { dropDraft(t.dataset.cid, t.dataset.key); act({ type: 'setValue', cid: t.dataset.cid, key: t.dataset.key, value: t.value }); }
  if (t.matches('[data-formstyle]')) act({ type: 'setFormStyle', cid: t.dataset.formstyle, style: t.value });
  if (t.matches('[data-rangew]')) { ui.rangeW = t.value ? { cid: t.dataset.rangew, k: t.value } : null; renderRoom(); return; }

  if (t.matches('[data-used]')) act({ type: 'toggleUsed', cid: t.dataset.used, group: t.dataset.group, idx: +t.dataset.idx });
});
document.addEventListener('input', e => { if (e.target.id === 'memo') ui.memo = e.target.value; });
document.addEventListener('toggle', e => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.sheet) return;
  if (d.open) ui.openSheets.add(d.dataset.sheet); else ui.openSheets.delete(d.dataset.sheet);
}, true);

function applyTheme() {
  const t = U.theme || 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.textContent = t === 'dark' ? '明るい表示' : '暗い表示');
}
function render() { applyTheme(); if (ONLINE) netConnect(); const r = route(); if (r.view === 'room') renderRoom(); else renderList(); }
window.addEventListener('hashchange', () => {
  ui.sel = []; ui.selTok = null; ui.history = []; ui.fxInit = false;
  if (ONLINE && route().view !== 'room') { NET.roomId = null; DB.rooms = {}; }
  render();
});
render();
</script>
</body>
</html>

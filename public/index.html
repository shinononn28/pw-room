<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--PW_ONLINE-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プリンセスウイング卓（ローカル版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1p:wght@400;500;700;800&family=Chakra+Petch:wght@500;600;700&family=Roboto:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens =====
   Clear steps: page (darkest) -> panel -> inside a panel (lightest of the three).
   The board is a bright window of sky inside the dark UI: the one memorable element. */
:root{
  --sky:#0A0D1E; --cloud:#1B2246; --mist:#2B3460; --line:#3E4A80;
  --ink:#F3F5FF; --ink-2:#AEB7DD;
  --pink:#FF5C96; --pink-ink:#FFFFFF; --pink-soft:#4A2246;
  --gold:#FFC24B; --void:#3A2F86; --void-2:#A595FF;
  --board:#F4F8FF; --cell:#E2ECFA; --cell-2:#C8D9F1; --cell-ink:#4A5A8C; --cell-line:#B3C6E4;
  --red:#FF6B87; --ok:#36D49A; --ng:#FF6B87;
  --shadow:0 20px 44px -22px rgba(0,0,0,.85);
  --num:"Chakra Petch","M PLUS 1p",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --sky:#C9D4E8; --cloud:#FFFFFF; --mist:#EAF0F8; --line:#C2CEE2;
  --ink:#121A38; --ink-2:#4E5A80;
  --pink:#E23C79; --pink-ink:#FFFFFF; --pink-soft:#FBE0EA;
  --gold:#E5A021; --void:#3A2F86; --void-2:#5B4FB0;
  --board:#1B2246; --cell:#E2ECFA; --cell-2:#C8D9F1; --cell-ink:#4A5A8C; --cell-line:#B3C6E4;
  --red:#D02F4E; --ok:#14966A; --ng:#D02F4E;
  --shadow:0 18px 40px -24px rgba(18,26,56,.55);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:"M PLUS 1p","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-weight:500;line-height:1.6;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{max-width:1480px;margin:0 auto;padding:10px 14px 80px}
h1{font-size:1.3rem;font-weight:800;margin:0;letter-spacing:.02em}
h2{font-size:.9rem;font-weight:800;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .grow{flex:1}
.muted{color:var(--ink-2);font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* buttons: pink = the one main action, ghost = everything else */
.btn{border:1.5px solid var(--line);background:var(--mist);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.9rem;line-height:1.4}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn.small{padding:2px 11px;font-size:.82rem}
.btn.ghost{background:transparent}
.top .btn.ghost,.top .back{border-color:var(--line);color:var(--ink-2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.38;cursor:default}
input[type=text],input[type=number],select,textarea{border:1.5px solid var(--line);background:var(--mist);border-radius:10px;padding:5px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 12px}
.top .grow{flex:1}
.back{text-decoration:none;color:var(--ink-2);font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line)}
.back:hover{border-color:var(--ink-2)}
.viewsel{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;color:var(--ink-2)}
.viewsel select{font-weight:700;color:var(--ink)}

/* layout: chat is a first-class column for text sessions.
   Wide screens: header + board on the left, chat runs the full height on the right. */
.mainPane{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--cloud);border-radius:18px;padding:14px}
@media (min-width:960px){
  #roomShell{display:grid;grid-template-columns:minmax(0,1fr) minmax(480px,54%);grid-template-rows:auto 1fr;column-gap:18px;align-items:start}
  #roomShell .layout{display:contents}
  #roomShell .top{grid-column:1;grid-row:1}
  .mainPane{grid-column:1;grid-row:2}
  .chatPane{grid-column:2;grid-row:1 / span 2;position:sticky;top:10px;height:calc(100dvh - 20px)}
  .mnav{display:none}
}
@media (min-width:1500px){ #app{max-width:1600px} #roomShell{grid-template-columns:minmax(0,1fr) minmax(640px,56%)} }
/* phones: one pane at a time, switched from the bottom bar */
@media (max-width:959px){
  #roomShell[data-pane="board"] .chatPane{display:none}
  #roomShell[data-pane="chat"] .mainPane{display:none}
  #roomShell[data-pane="board"]{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  #roomShell[data-pane="chat"]{display:flex;flex-direction:column;height:calc(100dvh - 86px - env(safe-area-inset-bottom,0px))}
  #roomShell[data-pane="chat"] .layout{flex:1;min-height:0;display:flex}
  #roomShell[data-pane="chat"] .chatPane{flex:1;min-height:0;display:flex}
  #roomShell[data-pane="chat"] .chat{flex:1}
  #app:has(#roomShell[data-pane="chat"]){padding-bottom:0}
  .top{gap:8px;padding:2px 0 8px;flex-wrap:nowrap}
  .top h1{font-size:1.05rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .grow{display:none}
  .viewsel{margin-left:auto}
  .viewsel select{max-width:38vw}
  #undoBtn,#setBtn{display:none}
  .mnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cloud);box-shadow:0 -8px 24px -16px rgba(14,21,48,.5)}
  .mnav button{border:none;background:transparent;border-radius:999px;padding:9px 0;font-weight:800;font-size:.95rem;color:var(--ink-2);position:relative}
  .mnav button[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
  .mnav .badge{background:var(--gold) !important;color:#2A1C00 !important}
  .mnav .badge{position:absolute;top:2px;right:calc(50% - 4.2em);min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:.72rem;line-height:20px;padding:0 6px;font-family:var(--num)}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
/* ===== map: floats on the sky, no card around it ===== */
.skyP{padding:2px 0 6px}
.turnbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.turnbar:empty{display:none}
.roundTag{font-weight:800;font-size:.95rem;color:var(--ink)}
.roundTag b{font-family:var(--num);font-size:1.4rem;margin:0 2px;vertical-align:-1px}
.mapwrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:start}
.board{display:grid;grid-template-columns:20px repeat(8,1fr);grid-template-rows:repeat(8,1fr) 18px;gap:0;aspect-ratio:1/1;max-width:560px;margin:0 auto;user-select:none;
  background:var(--board);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
.cell{position:relative;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:2px;min-width:0;min-height:0;
  background:var(--cell);border-right:1px solid var(--cell-line);border-bottom:1px solid var(--cell-line)}
.cell.alt{background:var(--cell-2)}
.cell.target{cursor:pointer}
@media (hover:hover){.cell.target:hover{background:#FFD3E3}}
.cell .dist{position:absolute;right:3px;bottom:1px;font-family:var(--num);font-size:.68rem;font-weight:700;color:var(--cell-ink)}
.coord{display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:.72rem;font-weight:700;color:var(--cell-ink)}
:root[data-theme="light"] .coord{color:#C8D4F0}
.tok{width:min(84%,50px);aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(.6rem,2.2vw,.9rem);
  border:3px solid #FFFFFF;box-shadow:0 3px 8px rgba(10,13,30,.45);overflow:hidden;white-space:nowrap;position:relative;z-index:1}
.cell.multi .tok{width:46%;border-width:2px}
.tok.enemy{background:var(--void);border-color:#1A1440}
.tok.sel{box-shadow:0 0 0 4px var(--gold),0 3px 8px rgba(10,13,30,.45)}
.tok.down{filter:grayscale(.9);opacity:.55}
.tok img{width:100%;height:100%;object-fit:cover;object-position:top}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;max-width:620px;margin-left:auto;margin-right:auto}

/* turn order list (left of the map) */
.order{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow:auto;padding:2px}
.oitem{display:grid;grid-template-columns:32px 1fr auto;column-gap:8px;align-items:center;text-align:left;border:none;background:var(--cloud);color:var(--ink);border-radius:12px;padding:6px 8px;min-width:0;position:relative}
.oitem::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--pink)}
.oitem.enemy::before{background:var(--void)}
.oitem .pt{width:32px;height:32px;grid-row:1/3;border-radius:50%}
.oitem .oname{font-weight:800;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oitem .ometa{font-family:var(--num);font-size:.74rem;font-weight:600;color:var(--ink-2);white-space:nowrap;grid-column:2}
.oitem .oset{grid-row:1/3;grid-column:3;color:var(--ink-2);padding:2px 6px;border-radius:8px;font-size:.8rem}
.oitem .oset:hover{background:var(--pink-soft);color:var(--pink)}
.oitem.now{box-shadow:inset 0 0 0 2px var(--gold);background:var(--mist)}
.oitem:hover{background:var(--mist)}
.oitem.now::after{content:"手番";position:absolute;top:-7px;right:8px;font-size:.66rem;font-weight:800;color:#4A3000;background:var(--gold);border-radius:999px;padding:0 8px;line-height:1.6}
.oitem.sel{outline:2px dashed var(--gold);outline-offset:1px}
@media (max-width:0px){
  .mapwrap{grid-template-columns:1fr}
  .order{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
  .oitem{min-width:160px}
}

/* ===== hand tray: navy, cards pop ===== */
.tray{background:var(--cloud);color:var(--ink);border-radius:18px;padding:14px 16px 16px}
.tray h2{color:var(--ink)}
.tray .muted{color:var(--ink-2)}
.tray .btn{background:var(--mist);color:var(--ink);border-color:var(--line)}
.tray .btn:hover:not(:disabled){border-color:var(--ink-2)}
.tray .btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.tray .btn.danger{color:var(--red)}
.tray input[type=text]{background:var(--mist);border-color:var(--line);color:var(--ink)}
.tray input::placeholder{color:var(--ink-2)}
.handHead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.handHead b{font-weight:800}
.handHead .count{font-family:var(--num);font-weight:700;color:var(--gold)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{width:52px;height:74px;border-radius:8px;border:none;background:#FFFFFF;color:#1B2547;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--num);font-weight:700;line-height:1;padding:0;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s}
.card .r{font-size:1.25rem} .card .s{font-size:1.3rem;margin-top:2px}
.card.red{color:#D7334E}
.card.joker{color:#6A4CD6;font-size:.62rem;letter-spacing:.04em}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.18)}
.card.mini{width:32px;height:46px;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.card.mini .r{font-size:.85rem}.card.mini .s{font-size:.85rem;margin-top:1px}
/* card back: princess-pink with a wing-like chevron weave */
.card.back{background:
  repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.28) 5px 7px),
  repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.28) 5px 7px),
  var(--pink);box-shadow:inset 0 0 0 2px #fff,0 2px 0 rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.actions .btn{padding:9px 6px;font-size:.92rem}
.memo{width:100%;margin-top:12px}
.otherHands{margin-top:16px;padding:12px;border-radius:14px;background:var(--mist);display:grid;gap:12px}
.who2{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;margin-bottom:5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--pink)}
.dot.gm{background:var(--void-2)}
.chip{display:inline-flex;align-items:center;padding:0 7px;border-radius:6px;background:#fff;border:1px solid var(--line);font-family:var(--num);font-weight:700;color:#1B2547;font-size:.88rem;line-height:1.6}
.chip.red{color:#D7334E}

/* ===== chat: white sheet ===== */
.chat{padding:12px 14px 12px;height:100%;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-2px -2px 10px;padding:2px}
.tab{border:none;background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap;font-size:.86rem;color:var(--ink-2)}
.tab:hover{background:var(--mist)}
.tab[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
.tab.secret{box-shadow:inset 0 0 0 1.5px var(--void-2)}
.tab.secret[aria-pressed="true"]{background:var(--void-2);box-shadow:none;color:#120E33}
.tab .lock{font-size:.7rem;margin-left:4px;opacity:.85}
.log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 6px 4px 0;font-size:.98rem}
.msg{display:flex;gap:10px;align-items:flex-start}
.pt{width:48px;height:48px;border-radius:14px;object-fit:cover;object-position:top;flex:none;background:var(--mist)}
.pt.none{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem}
.mbody{min-width:0;flex:1}
.mname{font-weight:800;font-size:.86rem}
.mname .t,.le .t{color:var(--ink-2);font-family:var(--num);font-size:.7rem;font-weight:500;margin-left:8px}
.mtext{white-space:pre-wrap;word-break:break-word;line-height:1.75}
.dice{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:6px;background:var(--mist);border-left:4px solid var(--line);border-radius:4px 12px 12px 4px;padding:7px 12px}
.dice.ok{border-left-color:var(--ok)} .dice.ng{border-left-color:var(--ng)}
.dice .dres{font-family:var(--num);font-size:.82rem;font-weight:600;color:var(--ink-2);word-break:break-all}
.dice .dtotal{font-family:var(--num);font-size:1.5rem;font-weight:700;margin-left:auto;line-height:1;color:var(--ink)}
.dice .dverdict{font-weight:800;font-size:.78rem;border-radius:999px;padding:1px 9px;background:var(--line);color:var(--ink)}
.dice.ok .dverdict{background:var(--ok);color:#fff} .dice.ng .dverdict{background:var(--ng);color:#fff}
.dice .dverdict.s{background:var(--void);color:#fff}
.dice.secret{box-shadow:inset 0 0 0 1.5px var(--void-2)}
.le{font-size:.86rem;padding:1px 0 1px 10px;border-left:3px solid var(--line);line-height:1.7;color:var(--ink-2)}
.le .who{color:var(--ink)}
.le.pc{border-left-color:var(--pink)} .le.gm{border-left-color:var(--void-2)} .le.sys{color:var(--ink-2)}
.le .who{font-weight:800;margin-right:6px}
.le .kind{font-weight:800;font-size:.76rem;padding:1px 8px;border-radius:999px;background:var(--pink);color:#fff;margin:0 6px}
.le.round{border-left:none;text-align:center;font-weight:800;color:var(--gold);letter-spacing:.04em;padding:6px 0;margin:4px 0;font-size:.82rem;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.le.turn{border-left-color:var(--gold);font-weight:700}
.composer{display:flex;flex-direction:column;gap:8px;margin:10px -14px -12px;padding:12px 14px;background:var(--mist);border-radius:0 0 18px 18px}
.composer textarea,.composer select,.composer input[type=text]{background:var(--cloud)}
.speak{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.speak .pt{width:32px;height:32px;border-radius:50%}
.speak select{max-width:45%;font-weight:700}
.speak #freeName{flex:1;min-width:6em}
.composer textarea{width:100%;min-height:4.8em;resize:vertical;line-height:1.65;font-size:1rem}
.palette{display:flex;flex-wrap:wrap;gap:5px;max-height:240px;overflow:auto;background:var(--cloud);border-radius:12px;padding:8px}
.palette .pgrp{width:100%;font-size:.72rem;font-weight:800;color:var(--ink-2);margin-top:2px}
.pcmd{border:1.5px solid var(--line);background:var(--mist);border-radius:999px;padding:1px 10px;font-size:.82rem;font-weight:700}
.pcmd:hover{border-color:var(--pink);color:var(--pink)}
#tpRow{font-size:.84rem;font-weight:700;background:var(--pink-soft);border-radius:10px;padding:5px 10px}
#tpInfo .warn{color:var(--red)}
#palBtn[aria-expanded="true"]{background:var(--mist);border-color:var(--pink);color:var(--pink)}

/* ===== characters ===== */
.ch{border-radius:14px;padding:10px 12px;margin-bottom:8px;background:var(--mist);position:relative;border-left:4px solid var(--pink)}
.ch.foe{border-left-color:var(--void-2)}
.ch.me{box-shadow:inset 0 0 0 2px var(--pink)}

.chead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chead .pt{width:38px;height:38px;border-radius:50%}
.uname{font-weight:800}
.vals{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.val{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:700;color:var(--ink-2)}
.val b,.val input{font-family:var(--num);font-weight:700;color:var(--ink);font-size:1rem}
.val input{width:3.4em;text-align:center;padding:1px 4px;background:var(--cloud)}
.val .max{font-family:var(--num);color:var(--ink-2);font-weight:600}
.val .btn{padding:0 8px;line-height:1.5}
.gauge{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;width:100%;margin-top:2px}
.gauge i{display:block;height:100%;background:var(--pink)}
details.sheet{margin-top:8px}
details.sheet summary{cursor:pointer;font-weight:700;font-size:.82rem;color:var(--pink)}
.item{border-top:1px solid var(--line);padding:7px 0;font-size:.86rem}
.item .iname{font-weight:800;display:flex;align-items:center;gap:6px}
.item .iname label{margin-left:auto;font-size:.74rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:3px}
.item.used .iname span:not(.attr):not(.suit){text-decoration:line-through;opacity:.55}
.attrs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.attr{font-size:.72rem;font-weight:700;background:var(--cloud);border-radius:999px;padding:0 8px;color:var(--ink-2)}
.itext{white-space:pre-wrap;color:var(--ink)}
.grp{font-size:.74rem;font-weight:800;color:var(--ink-2);margin-top:10px}
.suit{font-family:var(--num);font-weight:700;font-size:1.05rem;color:var(--ink)} .suit.red{color:var(--red)}

/* dialogs */
dialog{border:none;border-radius:20px;background:var(--cloud);color:var(--ink);padding:18px;max-width:min(540px,calc(100vw - 24px));width:100%;box-shadow:0 30px 60px -20px rgba(14,21,48,.5)}
dialog::backdrop{background:rgba(14,21,48,.45)}
dialog h1{margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-weight:700;font-size:.88rem}
.seatpick{display:flex;flex-wrap:wrap;gap:6px}
.wchip{border:1.5px solid var(--line);border-radius:999px;padding:2px 10px;font-weight:700;background:var(--cloud);font-size:.85rem;display:inline-flex;align-items:center;gap:4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:8px 0}
.pgrid figure{margin:0;text-align:center;font-size:.78rem}
.pgrid img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;border-radius:10px;background:var(--mist)}

<body>
<div id="app"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" hidden></div>
<script>
'use strict';
// =====================================================================
// core: state, actions, visibility
// Everything that changes a room goes through apply(room, action, by).
// Everything a viewer may see goes through the view* functions.
// When moving to a server, these two parts move there unchanged.
// =====================================================================
const SUIT = { S: '♠', C: '♣', H: '♥', D: '♦' };
const RANK = r => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[r] || String(r));
const KIND = { attack: '攻撃', evade: '回避', other: 'その他' };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// copy 1 uses plain ids (S7); extra decks get a suffix (S7#2) so every card stays unique
function newDeck(jokers, copies = 1) {
  const d = [];
  for (let k = 1; k <= copies; k++) {
    const tag = k === 1 ? '' : '#' + k;
    for (const s of 'SCHD') for (let r = 1; r <= 13; r++) d.push(s + r + tag);
    for (let i = 1; i <= jokers; i++) d.push('X' + i + tag);
  }
  return shuffle(d);
}
const cardOf = c => c[0] === 'X' ? { joker: true } : { s: c[0], r: parseInt(c.slice(1), 10) };
const cardText = c => { const k = cardOf(c); return k.joker ? 'JOKER' : SUIT[k.s] + RANK(k.r); };
function sortCards(cards, mode) {
  const so = { S: 0, C: 1, H: 2, D: 3 };
  return [...cards].sort((a, b) => {
    const x = cardOf(a), y = cardOf(b);
    if (x.joker || y.joker) return (x.joker ? 1 : 0) - (y.joker ? 1 : 0) || a.localeCompare(b);
    return mode === 'rank' ? (x.r - y.r || so[x.s] - so[y.s]) : (so[x.s] - so[y.s] || x.r - y.r);
  });
}

// Dropbox share link -> direct image link
function toDirectImage(url) {
  const s = (url || '').trim();
  try {
    const u = new URL(s);
    if (/(^|\.)dropbox\.com$/.test(u.hostname)) { u.searchParams.delete('dl'); u.searchParams.set('raw', '1'); }
    return u.toString();
  } catch (e) { return s; }
}

// ----- character import format (pw-character v2, v1 also accepted) -----
const SLOT_SUITS = ['S', 'C', 'H', 'D'];
// name colours chosen to stay readable on the black chat
const NAME_COLORS = ['#5DADEC', '#FF6B9A', '#4FD1A5', '#FFB547', '#B48CFF', '#7C8CFF', '#FF8A5C', '#E6E66A', '#FF7A7A', '#FFFFFF', '#9BE15D', '#F28CD8'];
const isHex = s => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);
const STAT_KEYS = ['HP', 'TP', 'SS値', '移動値'];
function normalizeChar(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('JSONの形になっていません');
  if (raw.format && raw.format !== 'pw-character') throw new Error(`形式が違います（${raw.format}）`);
  if (!raw.name || typeof raw.name !== 'string') throw new Error('name（キャラクター名）がありません');
  const item = x => ({ name: String(x?.name || ''), attrs: x?.attrs && typeof x.attrs === 'object' ? x.attrs : {}, text: String(x?.text || '') });
  // values: {HP:{max:20}} / {SS値:{value:3}} / {HP:20} (shorthand = max for HP/TP, value otherwise)
  const stats = {};
  for (const [k, v] of Object.entries(raw.values || {})) {
    if (v && typeof v === 'object') {
      if (Number.isFinite(Number(v.max))) stats[k] = { max: Number(v.max) };
      else if (Number.isFinite(Number(v.value))) stats[k] = { value: Number(v.value) };
    } else if (Number.isFinite(Number(v))) stats[k] = (k === 'HP' || k === 'TP') ? { max: Number(v) } : { value: Number(v) };
  }
  // weapons: {common:[2], slots:[4 by suit]}; a v1 array becomes common weapons
  const w = raw.weapons;
  const slotsFrom = arr => {
    const out = SLOT_SUITS.map(s => ({ suit: s, ...item(null) }));
    (Array.isArray(arr) ? arr : []).forEach((x, i) => {
      const s = SLOT_SUITS.includes(x?.suit) ? x.suit : SLOT_SUITS[i];
      if (s) out[SLOT_SUITS.indexOf(s)] = { suit: s, ...item(x) };
    });
    return out;
  };
  const weapons = Array.isArray(w) ? { common: w.map(item), slots: slotsFrom([]) }
    : { common: Array.isArray(w?.common) ? w.common.map(item) : [], slots: slotsFrom(w?.slots) };
  // 特殊機能 may sit in core.functions or at the top level (functions)
  const fnSrc = Array.isArray(raw.core?.functions) ? raw.core.functions : Array.isArray(raw.functions) ? raw.functions : [];
  const core = raw.core || fnSrc.length ? { ...item(raw.core || { name: '' }), functions: fnSrc.map(item) } : null;
  return {
    format: 'pw-character', version: 2,
    name: raw.name, player: String(raw.player || ''),
    core, stats,
    // tp: TP consumed when the 特技 is used (cost is accepted as an older name)
    skills: Array.isArray(raw.skills) ? raw.skills.map(x => { const t = x?.tp ?? x?.cost; return { ...item(x), tp: t != null && Number.isFinite(Number(t)) ? Number(t) : null }; }) : [],
    weapons,
    variations: Array.isArray(raw.variations) ? raw.variations.map(v => ({ name: String(v?.name || 'バリエーション'), slots: slotsFrom(v?.slots) })) : [],
    wingDrive: raw.wingDrive ? item(raw.wingDrive) : null,
    portraits: Array.isArray(raw.portraits) ? raw.portraits.filter(p => p && p.url).map(p => ({ label: String(p.label || '立ち絵'), url: toDirectImage(p.url) })) : [],
    memo: String(raw.memo || ''),
  };
}
const statStart = s => s.max ?? s.value;
const currentSlots = ch => ch.variation >= 0 && ch.data.variations[ch.variation] ? ch.data.variations[ch.variation].slots : ch.data.weapons.slots;
const ssOf = ch => Number.isFinite(ch.cur['SS値']) ? ch.cur['SS値'] : (ch.data.stats['SS値'] ? statStart(ch.data.stats['SS値']) : -Infinity);
// turn order: SS値 high -> low; ties: PC before enemy, then join order
function turnOrder(room) {
  return Object.values(room.chars).filter(c => c.side !== 'npc')
    .map((c, i) => ({ c, i }))
    .sort((a, b) => ssOf(b.c) - ssOf(a.c) || (a.c.side === 'pc' ? 0 : 1) - (b.c.side === 'pc' ? 0 : 1) || a.i - b.i)
    .map(x => x.c);
}

function newRoom(name) {
  return {
    id: uid('r'), name: name || '新しい部屋', createdAt: Date.now(),
    settings: { jokers: 2, decks: 1, opsTab: 'battle', digestTab: 'main', gmSeesSecret: true, logValues: true },
    turn: { round: 1, current: null },
    chars: {},
    cards: { deck: newDeck(2), discard: [], hands: { gm: [] } },
    tabs: [
      { id: 'main', name: 'メイン' },
      { id: 'battle', name: '戦闘' },
      { id: 'chat', name: '雑談' },
    ],
    logs: [],
  };
}

// seats: 'gm', each PC character id, 'obs'
const isPcSeat = (room, seat) => !!(room.chars[seat] && room.chars[seat].side === 'pc');
function seatName(room, seat) {
  if (seat === 'gm') return 'GM';
  if (seat === 'obs') return '観戦';
  return room.chars[seat]?.data.name || '（不明）';
}
function canControlChar(room, seat, cid) { return seat === 'gm' || seat === cid; }

class ActionError extends Error {}
function need(cond, msg) { if (!cond) throw new ActionError(msg); }

function log(room, entry) {
  // names are stored at the time of logging, so old logs stay readable after a character leaves
  const extra = { byName: seatName(room, entry.by) };
  if (entry.seat) extra.seatName = seatName(room, entry.seat);
  room.logs.push({ id: uid('l'), t: Date.now(), ...extra, ...entry });
  if (room.logs.length > 5000) room.logs.splice(0, room.logs.length - 5000);
}
// essentials (HP/TP changes, cards played, variation switches) also appear in the digest tab (メイン)
function isImportant(l) {
  if (l.type === 'play' || l.type === 'variation' || l.type === 'weapon') return true;
  if (l.type === 'value') return l.key === 'HP' || l.key === 'TP' || /の(HP|TP)：/.test(l.text || '');
  return false;
}
const digestTab = room => room.tabs.some(t => t.id === room.settings.digestTab) ? room.settings.digestTab : null;
function logsForTab(room, tabId) {
  const ops = opsTab(room), dg = digestTab(room);
  if (tabId === dg && dg !== ops) return room.logs.filter(l => l.tab === tabId || (l.tab === ops && isImportant(l)));
  return room.logs.filter(l => l.tab === tabId);
}
const opsTab = room => room.tabs.some(t => t.id === room.settings.opsTab) ? room.settings.opsTab : room.tabs[0].id;

function apply(room, a, by) {
  const name = seatName(room, by);
  const ch = a.cid ? room.chars[a.cid] : null;
  switch (a.type) {
    // ----- characters -----
    case 'addChar': {
      need(by === 'gm' || a.side === 'pc', '敵やNPCを追加できるのはGMだけです');
      const data = normalizeChar(a.data);
      const id = typeof a.id === 'string' && /^c[0-9a-z]{6,30}$/.test(a.id) && !room.chars[a.id] ? a.id : uid('c');
      const cur = {}; for (const [k, s] of Object.entries(data.stats)) cur[k] = statStart(s);
      const colors = NAME_COLORS.slice(0, 8);
      room.chars[id] = { id, side: a.side, data, cur, used: {}, variation: -1, x: null, y: null, portrait: data.portraits[0]?.label || null,
        color: a.side === 'enemy' ? '#FF7A7A' : colors[Object.keys(room.chars).filter(k => room.chars[k].side !== 'enemy').length % colors.length], owner: by };
      if (a.side === 'pc') room.cards.hands[id] = room.cards.hands[id] || [];
      log(room, { tab: opsTab(room), type: 'sys', by, text: `${data.name}（${{ pc: 'PC', enemy: '敵', npc: 'NPC' }[a.side]}）が参加しました` });
      return id;
    }
    case 'updateCharData': {
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターは編集できません');
      const data = normalizeChar(a.data);
      for (const [k, s] of Object.entries(data.stats)) if (!(k in ch.cur)) ch.cur[k] = statStart(s);
      ch.data = data;
      if (!(ch.variation < data.variations.length)) ch.variation = -1;
      if (ch.portrait && !data.portraits.some(p => p.label === ch.portrait)) ch.portrait = data.portraits[0]?.label || null;
      log(room, { tab: opsTab(room), type: 'sys', by, text: `${data.name}のデータを更新しました` });
      return;
    }
    case 'removeChar': {
      need(ch && (by === 'gm' || by === a.cid), 'このキャラクターは削除できません');
      const hand = room.cards.hands[a.cid] || [];
      room.cards.discard.push(...hand);
      delete room.cards.hands[a.cid];
      delete room.chars[a.cid];
      if (room.turn.current === a.cid) room.turn.current = null;
      log(room, { tab: opsTab(room), type: 'sys', by, text: `${ch.data.name}が退出しました${hand.length ? `（手札${hand.length}枚は捨て札へ）` : ''}` });
      return;
    }
    case 'setValue': {
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターの値は変えられません');
      const before = ch.cur[a.key];
      const v = Number(a.value);
      need(Number.isFinite(v), '数値を入れてください');
      if (before === v) return;
      ch.cur[a.key] = v;
      if (room.settings.logValues === false) return;
      // repeated +/- on the same value within a few seconds are folded into one log line (20 → 14)
      const last = room.logs[room.logs.length - 1];
      if (last && last.type === 'value' && !last.cmd && last.cid === a.cid && last.key === a.key && last.by === by && Date.now() - last.t < 8000) {
        if (last.from === v) room.logs.pop();
        else { last.to = v; last.t = Date.now(); last.text = `${ch.data.name}の${a.key}：${last.from} → ${v}`; }
        return;
      }
      log(room, { tab: opsTab(room), type: 'value', by, cid: a.cid, key: a.key, from: before, to: v, text: `${ch.data.name}の${a.key}：${before} → ${v}` });
      return;
    }
    case 'toggleUsed': {
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターは操作できません');
      const k = `${a.group}:${a.idx}`;
      ch.used[k] = !ch.used[k];
      const it = a.group === 'wingDrive' ? ch.data.wingDrive : a.group === 'common' ? ch.data.weapons.common[a.idx]
        : a.group.startsWith('slot') ? currentSlots(ch)[a.idx] : a.group === 'func' ? ch.data.core?.functions[a.idx] : ch.data[a.group]?.[a.idx];
      log(room, { tab: opsTab(room), type: 'value', by, text: `${ch.data.name}の「${it?.name || '?'}」を${ch.used[k] ? '使用済み' : '未使用'}にしました` });
      return;
    }
    case 'setPortraits': {
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターは編集できません');
      ch.data.portraits = a.portraits.map(p => ({ label: String(p.label || '立ち絵'), url: toDirectImage(p.url) })).filter(p => p.url);
      if (!ch.data.portraits.some(p => p.label === ch.portrait)) ch.portrait = ch.data.portraits[0]?.label || null;
      return;
    }
    case 'setColor': {
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターの色は変えられません');
      need(isHex(a.color), '色の指定が正しくありません');
      ch.color = a.color.toUpperCase();
      return;
    }
    case 'setPortrait': { need(ch && canControlChar(room, by, a.cid), '操作できません'); ch.portrait = a.label; return; }

    case 'variation': {
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターは操作できません');
      const i = a.idx | 0;
      need(i === -1 || ch.data.variations[i], 'そのバリエーションはありません');
      if (ch.variation === i) return;
      ch.variation = i;
      log(room, { tab: opsTab(room), type: 'variation', by, cid: a.cid, text: `${ch.data.name}の武装を「${i === -1 ? '基本' : ch.data.variations[i].name}」に切り替えました` });
      return;
    }

    // ----- turn -----
    case 'setTurn': {
      need(by === 'gm', '手番を指定できるのはGMだけです');
      need(a.cid === null || room.chars[a.cid], 'キャラクターが見つかりません');
      room.turn.current = a.cid;
      if (a.cid) log(room, { tab: opsTab(room), type: 'turn', by, text: `${room.chars[a.cid].data.name}の手番です` });
      return;
    }
    case 'nextTurn': {
      need(by === 'gm' || by === room.turn.current, '手番を進められるのは、GMか手番のPCだけです');
      const order = turnOrder(room);
      const i = order.findIndex(c => c.id === room.turn.current);
      const next = order[i + 1] || null;
      room.turn.current = next ? next.id : null;
      log(room, { tab: opsTab(room), type: 'turn', by, text: next ? `${next.data.name}の手番です` : '全員の手番が終わりました。ラウンド終了です' });
      return;
    }
    case 'endRound': {
      need(by === 'gm', 'ラウンドを進められるのはGMだけです');
      log(room, { tab: opsTab(room), type: 'round', by, text: `第${room.turn.round}ラウンド終了（手札交換のタイミングです）` });
      room.turn.round += 1;
      room.turn.current = turnOrder(room)[0]?.id || null;
      log(room, { tab: opsTab(room), type: 'round', by, text: `第${room.turn.round}ラウンド開始${room.turn.current ? `：${room.chars[room.turn.current].data.name}の手番です` : ''}` });
      return;
    }
    case 'resetRound': {
      need(by === 'gm', 'ラウンドを戻せるのはGMだけです');
      room.turn = { round: 1, current: turnOrder(room)[0]?.id || null };
      log(room, { tab: opsTab(room), type: 'round', by, text: `戦闘開始：第1ラウンド${room.turn.current ? `、${room.chars[room.turn.current].data.name}の手番です` : ''}` });
      return;
    }

    // ----- map -----
    case 'move': {
      need(ch && canControlChar(room, by, a.cid), 'このコマは動かせません');
      const from = ch.x == null ? '盤外' : coordName(ch.x, ch.y);
      if (a.x == null) { ch.x = ch.y = null; }
      else { need(a.x >= 0 && a.x < 8 && a.y >= 0 && a.y < 8, 'マップの外です'); ch.x = a.x; ch.y = a.y; }
      const to = ch.x == null ? '盤外' : coordName(ch.x, ch.y);
      if (from !== to) log(room, { tab: opsTab(room), type: 'move', by, text: `${ch.data.name}：${from} → ${to}` });
      return;
    }

    // ----- cards -----
    case 'draw': {
      const seat = a.seat || by;
      need(seat === by || by === 'gm', '他の人の手札は操作できません');
      need(seat === 'gm' || isPcSeat(room, seat), 'この席は手札を持てません');
      const n = Math.max(1, Math.min(20, a.n | 0));
      need(room.cards.deck.length >= n, `山札が足りません（残り${room.cards.deck.length}枚）`);
      const got = room.cards.deck.splice(0, n);
      (room.cards.hands[seat] = room.cards.hands[seat] || []).push(...got);
      // a GM draw only shows how many; PC draws are open to the PC side
      log(room, { tab: opsTab(room), type: 'draw', by, seat, n, cards: got, secretCards: seat === 'gm' });
      return;
    }
    case 'play': {
      const seat = a.seat || by;
      need(seat === by || by === 'gm', '他の人の手札は出せません');
      const hand = room.cards.hands[seat] || [];
      need(a.cards.length > 0, 'カードを選んでください');
      need(a.cards.every(c => hand.includes(c)), '手札にないカードが含まれています');
      room.cards.hands[seat] = hand.filter(c => !a.cards.includes(c));
      room.cards.discard.push(...a.cards);
      log(room, { tab: opsTab(room), type: 'play', by, seat, cards: a.cards, kind: a.kind, memo: (a.memo || '').trim(), as: a.as || null });
      return;
    }
    case 'pick': { // pick a card up from the discard pile (card effects)
      const seat = a.seat || by;
      need(seat === by || by === 'gm', '他の人の手札には拾えません');
      need(seat === 'gm' || isPcSeat(room, seat), 'この席は手札を持てません');
      const i = room.cards.discard.lastIndexOf(a.card);
      need(i >= 0, 'そのカードは捨て札にありません');
      room.cards.discard.splice(i, 1);
      (room.cards.hands[seat] = room.cards.hands[seat] || []).push(a.card);
      log(room, { tab: opsTab(room), type: 'pick', by, seat, cards: [a.card], memo: (a.memo || '').trim() });
      return;
    }
    case 'give': { // hand cards to an ally (e.g. end-of-round exchange)
      const seat = a.seat || by;
      need(seat === by || by === 'gm', '他の人の手札は渡せません');
      need(isPcSeat(room, seat) && isPcSeat(room, a.to) && seat !== a.to, '渡せるのは味方のPC同士だけです');
      const hand = room.cards.hands[seat] || [];
      need(a.cards.length && a.cards.every(c => hand.includes(c)), '手札にないカードが含まれています');
      room.cards.hands[seat] = hand.filter(c => !a.cards.includes(c));
      (room.cards.hands[a.to] = room.cards.hands[a.to] || []).push(...a.cards);
      log(room, { tab: opsTab(room), type: 'give', by, seat, to: a.to, toName: seatName(room, a.to), cards: a.cards });
      return;
    }
    case 'useWeapons': { // declare one or more weapons at once, discarding any cards (suits are not enforced)
      need(ch && canControlChar(room, by, a.cid), 'このキャラクターは操作できません');
      const seat = ch.side === 'pc' ? ch.id : 'gm';
      const hand = room.cards.hands[seat] || [];
      const cards = Array.isArray(a.cards) ? a.cards : [];
      need(cards.every(x => hand.includes(x)) && new Set(cards).size === cards.length, '手札にないカードが含まれています');
      const pool = { c: ch.data.weapons.common, s: currentSlots(ch) };
      const ws = (Array.isArray(a.weapons) ? a.weapons : []).map(k => pool[String(k)[0]]?.[+String(k).slice(1)]).filter(w => w && w.name);
      need(ws.length, '武装を選んでください');
      room.cards.hands[seat] = hand.filter(x => !cards.includes(x));
      room.cards.discard.push(...cards);
      log(room, { tab: opsTab(room), type: 'weapon', by, seat, cid: ch.id, charName: ch.data.name,
        weapons: ws.map(w => ({ name: w.name, suit: w.suit || null, attrs: { ...(w.attrs || {}) }, text: w.text || '' })),

  const total = ui.unreadTotal;
  $('unread').hidden = total <= 0; $('unread').textContent = total > 99 ? '99+' : total;

// unread counts per tab, tracked by log id: a log read in one tab (e.g. an HP change shown in
// both メイン and 戦闘) is read everywhere. The open tab counts as read while the chat is on screen.
function computeUnread(room, ru) {
  const v = ru.viewer, key = room.id + ':' + v;
  const chatOnScreen = ru.pane === 'chat' || matchMedia('(min-width:960px)').matches;
  let seen = ui.seenTab[key];
  const lists = {};
  for (const t of room.tabs) if (canSeeTab(room, t, v)) lists[t.id] = logsForTab(room, t.id).filter(l => l.by !== v && viewLog(room, l, v));
  if (!seen) { seen = ui.seenTab[key] = new Set(); Object.values(lists).forEach(list => list.forEach(l => seen.add(l.id))); }
  if (chatOnScreen && lists[ru.tab]) lists[ru.tab].forEach(l => seen.add(l.id));
  ui.unread = {}; const ids = new Set();
  for (const [tid, list] of Object.entries(lists)) {
    const un = list.filter(l => !seen.has(l.id));
    ui.unread[tid] = un.length; un.forEach(l => ids.add(l.id));
  }
  ui.unreadTotal = ids.size;
}

  let cells = '';

      cells += `<div class="cell ${(x + y) % 2 ? 'alt' : ''} ${list.length > 1 ? 'multi' : ''} ${sel ? 'target' : ''} ${reach ? 'reach' : ''}" data-cell="${x},${y}" aria-label="${coordName(x, y)}${reach ? '（移動値の範囲内）' : ''}">

// online mode: talk to the room server over WebSocket.
// The browser validates an action on a copy of its own (filtered) state first, so mistakes are

const NET = { ws: null, roomId: null, wantSeat: null, backoff: 500, status: 'idle', renderQueued: false };
const loadJson = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
const gmKeys = () => loadJson('pw-gmkeys', {});

const recentRooms = () => loadJson('pw-recent', []);
function rememberRoom(id, name) {
  const list = recentRooms().filter(r => r.id !== id);
  list.unshift({ id, name, at: Date.now() });
  try { localStorage.setItem('pw-recent', JSON.stringify(list.slice(0, 20))); } catch (e) {}
}

function netStatus(s) {
  NET.status = s;
  const el = document.getElementById('netDot');
  if (el) { el.dataset.s = s; el.title = { open: '接続中', connecting: '接続しています…', closed: '再接続を待っています…' }[s] || ''; }
}
function netConnect() {
  if (NET.ws && NET.ws.readyState <= 1) return;
  netStatus('connecting');
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
  NET.ws = ws;
  ws.onopen = () => { NET.backoff = 500; netStatus('open'); if (NET.roomId) netJoin(NET.roomId, NET.wantSeat); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (err) { return; } onNet(m); };
  ws.onclose = () => { netStatus('closed'); setTimeout(netConnect, NET.backoff); NET.backoff = Math.min(NET.backoff * 2, 10000); };
}
function netSend(m) {
  if (NET.ws && NET.ws.readyState === 1) { NET.ws.send(JSON.stringify(m)); return true; }
  toast('サーバーとの接続が切れています。再接続を待っています'); netConnect(); return false;
}
function netJoin(id, seat) {
  NET.roomId = id; NET.wantSeat = seat || NET.wantSeat || 'obs';
  if (!NET.ws || NET.ws.readyState !== 1) { netConnect(); return; }
  NET.ws.send(JSON.stringify({ t: 'join', room: id, seat: NET.wantSeat, gmKey: gmKeys()[id] || null }));
}
function queueRender() {
  if (NET.renderQueued) return;
  NET.renderQueued = true;
  requestAnimationFrame(() => { NET.renderQueued = false; const r = route(); if (r.view === 'room') renderRoom(); });
}
function onNet(m) {
  if (m.t === 'joined') {
    DB.rooms = { [m.room.id]: { ...m.room, logs: m.logs } };
    const ru = roomUI(m.room.id);
    if (ru.viewer !== m.seat) ru.as = null;     // speak as the new seat's character by default
    ru.viewer = m.seat; NET.wantSeat = m.seat;
    rememberRoom(m.room.id, m.room.name);
    ui.seenTab = {};
    queueRender(); return;
  }
  if (m.t === 'state') {
    const old = DB.rooms[m.room.id]; if (!old) return;
    DB.rooms[m.room.id] = { ...m.room, logs: old.logs };
    const ru = roomUI(m.room.id);
    if (ru.viewer !== m.seat) { ru.viewer = m.seat; ru.as = null; NET.wantSeat = m.seat; }
    queueRender(); return;
  }
  if (m.t === 'logs') {
    const r = DB.rooms[m.room]; if (!r) return;
    if (m.reset) r.logs = m.add || [];
    else {
      if (m.remove && m.remove.length) r.logs = r.logs.filter(l => !m.remove.includes(l.id));
      for (const u of m.update || []) { const i = r.logs.findIndex(l => l.id === u.id); if (i >= 0) r.logs[i] = u; else r.logs.push(u); }
      r.logs.push(...(m.add || []));
    }
    queueRender(); return;
  }
  if (m.t === 'error') {
    toast(m.message || 'エラーが起きました');
    if (m.code === 'not_found') { forgetRoom(NET.roomId); NET.roomId = null; location.hash = '#/'; }
  }
}

}
function fixCardDialog(room, card, from) {
  const targets = [['discard', '捨て札'], ['gm', 'GMの手札'], ...Object.values(room.chars).filter(c => c.side === 'pc' && c.id !== from).map(c => [c.id, `${c.data.name}の手札`]), ['deck', '山札の上']];
  openDlg(`<h1>カードの補正</h1><p>${chipHtml(card)}（${esc(seatName(room, from))}の手札）を移します。</p>
    <div class="field">移動先<select id="fxTo">${targets.map(([v, n]) => `<option value="${v}">${esc(n)}</option>`).join('')}</select></div>
    <div class="row"><span style="flex:1"></span><button class="btn" data-close>やめる</button><button class="btn primary" id="fxOk">移す</button></div>`, () => {
    $('fxOk').onclick = () => { act({ type: 'moveCard', card, from, to: $('fxTo').value }); closeDlg(); };
  });
}
function settingsDialog(room) {
  const s = room.settings;
  openDlg(`<h1>部屋の設定</h1>
    <div class="field">部屋の名前<input type="text" id="stName" value="${esc(room.name)}"></div>
    <div class="field">トランプの組数（山札を作り直したときに反映）<select id="stDecks">${[1, 2, 3, 4].map(n => `<option ${(s.decks || 1) === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field">ジョーカーの枚数（山札を作り直したときに反映）<select id="stJk">${[0, 1, 2].map(n => `<option ${s.jokers === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="field">操作の記録をすべて流すタブ<select id="stOps">${room.tabs.map(t => `<option value="${t.id}" ${s.opsTab === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
    <div class="field">要点（HP・TPの増減、出したカード、バリエーション変更）も表示するタブ<select id="stDigest"><option value="">表示しない</option>${room.tabs.map(t => `<option value="${t.id}" ${s.digestTab === t.id ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></div>
    <label class="row" style="margin-bottom:6px"><input type="checkbox" id="stGmSecret" ${s.gmSeesSecret ? 'checked' : ''}> GMはすべての秘匿タブを見られる</label>
    <label class="row" style="margin-bottom:10px"><input type="checkbox" id="stLogVals" ${s.logValues !== false ? 'checked' : ''}> HPなどの数値の変更をログに残す（続けて増減した分は1行にまとめます）</label>
    ${ONLINE ? `<div class="field">GM用リンク（別の端末でGMとして入るとき用。PLには送らないでください）<div class="row"><input type="text" readonly value="${esc(gmLink(room.id))}" style="flex:1" id="stGmLink"><button class="btn small" id="stCopyGm">コピー</button></div></div>` : ''}
    <div class="row"><span style="flex:1"></span><button class="btn" data-close>やめる</button><button class="btn primary" id="stOk">保存</button></div>`, () => {
    if ($('stCopyGm')) $('stCopyGm').onclick = async () => { try { await navigator.clipboard.writeText($('stGmLink').value); toast('GM用リンクをコピーしました'); } catch (err) { $('stGmLink').select(); } };
    $('stOk').onclick = () => {
      act({ type: 'settings', name: $('stName').value.trim() || room.name, patch: { digestTab: $('stDigest').value || null, decks: +$('stDecks').value, jokers: +$('stJk').value, opsTab: $('stOps').value, gmSeesSecret: $('stGmSecret').checked, logValues: $('stLogVals').checked } });
      closeDlg();
    };
  });
}

function bindRoomStatic() {
  $('viewer').onchange = e => {
    const room = curRoom(), ru = roomUI(room.id);
    ru.as = null; ui.sel = []; ui.selTok = null; ui.cmd = null;
    if (ONLINE) { netJoin(room.id, e.target.value); return; }   // the server decides the seat
    ru.viewer = e.target.value; renderRoom();
  };
  if (ONLINE) $('inviteBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(inviteLink(curRoom().id)); toast('招待リンクをコピーしました。PLに送ってください'); }
    catch (err) { prompt('招待リンク', inviteLink(curRoom().id)); }
  };
  $('setBtn').onclick = () => settingsDialog(curRoom());
  $('undoBtn').onclick = () => {
    const prev = ui.history.pop(); if (!prev) return;
    const r = JSON.parse(prev); DB.rooms[r.id] = r; persist(); renderRoom(); toast('1つ前の状態に戻しました');
  };
  $('asSel').onchange = e => { roomUI(curRoom().id).as = e.target.value; renderRoom(); };
  $('ptSel').onchange = e => { const ru = roomUI(curRoom().id); act({ type: 'setPortrait', cid: ru.as, label: e.target.value }); };
  $('freeName').oninput = e => { roomUI(curRoom().id).name = e.target.value; saveU(); };
  const send = () => {
    const room = curRoom(), ru = roomUI(room.id), text = $('sayText').value;
    if (!text.trim()) return;
    const c = room.chars[ru.as];
    const cmd = ui.cmd && c && ui.cmd.cid === c.id ? ui.cmd : null;
    const spend = cmd && cmd.tp ? cmd.tp : null;
    const r = act({ type: 'say', tab: ru.tab, as: c ? c.id : null, name: c ? null : ($('freeName').value.trim() || seatName(room, ru.viewer)), color: c ? null : (ru.freeColor || null), portrait: c ? c.portrait : null, text,
      cmd: cmd ? cmd.name : null, spendTP: Number.isFinite(spend) ? spend : null });
    if (r !== FAIL) { $('sayText').value = ''; ui.cmd = null; renderRoom(); }
    $('sayText').focus();
  };
  $('sayBtn').onclick = send;
  $('palBtn').onclick = () => openModal('cmd');
  $('colorBtn').onclick = () => {
    const room = curRoom(), ru = roomUI(room.id), c = room.chars[ru.as];
    if (c) colorDialog(c.color, col => act({ type: 'setColor', cid: c.id, color: col }));
    else colorDialog(ru.freeColor, col => { ru.freeColor = col; saveU(); renderRoom(); });
  };
  $('cmdClear').onclick = () => { ui.cmd = null; $('sayText').value = ''; renderRoom(); };
  $('sayText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  $('copyLog').onclick = async () => {
    const room = curRoom(), ru = roomUI(room.id);
    const text = logsForTab(room, ru.tab).map(l => viewLog(room, l, ru.viewer)).filter(Boolean).map(l => logPlain(room, l)).join('\n');
    try { await navigator.clipboard.writeText(text); toast('ログをコピーしました'); } catch (e) { toast('コピーできませんでした'); }
  };
}

// card / character actions, shared by the page and the modals
function commonClick(t, room, ru) {
  const q = s => t.closest(s);
  let el;
  // cards
  if ((el = q('[data-pick]'))) { const c = el.dataset.pick; ui.sel = ui.sel.includes(c) ? ui.sel.filter(x => x !== c) : [...ui.sel, c]; renderCards(room, ru); return true; }
  if (q('[data-sort]')) { ru.sort = ru.sort === 'rank' ? 'suit' : 'rank'; saveU(); renderCards(room, ru); return true; }
  if ((el = q('[data-play]'))) {
    const cards = [...ui.sel], memo = ui.memo;
    if (act({ type: 'play', cards, kind: el.dataset.play, memo }, { silent: true }) !== FAIL) { ui.sel = []; ui.memo = ''; }
    renderRoom(); return true;
  }
  if ((el = q('[data-drawstep]'))) { ui.drawN = Math.max(1, Math.min(20, ui.drawN + +el.dataset.drawstep)); renderCards(room, ru); return true; }
  if (q('[data-draw]')) { act({ type: 'draw', n: ui.drawN }); return true; }
  if (q('[data-shuffleback]')) { act({ type: 'shuffleBack' }); return true; }
  if (q('[data-adddeck]')) { ask('トランプをもう1組、今の山札に混ぜてシャッフルします。', 'トランプを追加', () => act({ type: 'addDeck' })); return true; }
  if (q('[data-resetdeck]')) { ask(`全員の手札と捨て札を回収し、${room.settings.decks || 1}組で山札を作り直します。`, '山札を作り直す', () => act({ type: 'resetDeck' }), true); return true; }
  if (q('[data-discards]')) { discardDialog(room, ru); return true; }
  if (q('[data-give]')) { giveDialog(room, ru); return true; }
  if ((el = q('[data-fixcard]'))) { fixCardDialog(room, el.dataset.fixcard, el.dataset.from); return true; }

  // characters
  if (q('[data-import]')) { importDialog(room, ru); return true; }
  if ((el = q('[data-editchar]'))) { importDialog(room, ru, el.dataset.editchar); return true; }
  if ((el = q('[data-colorpick]'))) { const c = room.chars[el.dataset.colorpick]; colorDialog(c.color, col => act({ type: 'setColor', cid: c.id, color: col })); return true; }
  if ((el = q('[data-sheetopen]'))) { openModal('sheet', el.dataset.sheetopen); return true; }
  if ((el = q('[data-portraits]'))) { portraitDialog(room, el.dataset.portraits); return true; }
  if ((el = q('[data-delchar]'))) { const c = room.chars[el.dataset.delchar]; ask(`${c.data.name}を部屋から外します。手札は捨て札に移ります。`, 'キャラクターを外す', () => act({ type: 'removeChar', cid: c.id }), true); return true; }
  if ((el = q('[data-vstep]'))) { const c = room.chars[el.dataset.cid], k = el.dataset.key; act({ type: 'setValue', cid: c.id, key: k, value: c.cur[k] + +el.dataset.vstep }); return true; }

  if (q('[data-opensettings]')) { settingsDialog(room); return true; }
  return false;
}

// map interactions, shared by the page and the big map modal
function mapClick(t, room, ru) {
  const q = s => t.closest(s);
  let el;
  if ((el = q('[data-movechar]'))) { ui.selTok = el.dataset.movechar; closeDlg(); if (isPhone()) openModal('map'); else renderRoom(); return true; }
  if ((el = q('[data-setturn]'))) { act({ type: 'setTurn', cid: el.dataset.setturn }); return true; }
  if (q('[data-nextturn]')) { act({ type: 'nextTurn' }); return true; }
  if (q('[data-endround]')) { act({ type: 'endRound' }); return true; }
  if (q('[data-resetround]')) { ask('ラウンド数を1に戻し、SS値がいちばん大きいキャラの手番から始めます。', '戦闘を開始', () => act({ type: 'resetRound' })); return true; }
  // a selected token + a tap on a cell (even one holding another token) = move there
  if ((el = q('[data-cell]')) && ui.selTok && !(q('[data-tok]') && q('[data-tok]').dataset.tok === ui.selTok)) {
    const [x, y] = el.dataset.cell.split(',').map(Number);
    if (act({ type: 'move', cid: ui.selTok, x, y }, { silent: true }) !== FAIL) ui.selTok = null;
    renderRoom(); return true;
  }
  if ((el = q('[data-tok]'))) { const id = el.dataset.tok; ui.selTok = ui.selTok === id ? null : id; renderRoom(); return true; }
  if (q('[data-offboard]')) { if (act({ type: 'move', cid: ui.selTok, x: null, y: null }, { silent: true }) !== FAIL) ui.selTok = null; renderRoom(); return true; }
  if (q('[data-unsel]')) { ui.selTok = null; renderRoom(); return true; }
  return false;
}

document.addEventListener('click', e => {
  const t = e.target, q = s => t.closest(s);
  const room = curRoom();
  let el;
  if ((el = q('[data-export]'))) { const r = DB.rooms[el.dataset.export]; download(`${r.name}.json`, JSON.stringify(r, null, 1)); return; }
  if ((el = q('[data-delroom]'))) { const r = DB.rooms[el.dataset.delroom]; ask(`「${r.name}」を削除します。ログもすべて消えます。`, '部屋を削除', () => { delete DB.rooms[r.id]; persist(); renderList(); }, true); return; }
  if (!room && (el = q('[data-forget]'))) { forgetRoom(el.dataset.forget); renderList(); return; }
  if (!room && q('[data-theme-toggle]')) { U.theme = (U.theme || 'dark') === 'dark' ? 'light' : 'dark'; saveU(); applyTheme(); return; }
  if (!room || !t.isConnected || t.closest('dialog')) return;
  const ru = roomUI(room.id);

  if (t.closest('[data-vstep],[data-setturn]') && t.closest('[data-charopen]')) { /* buttons inside the list row act, the row does not open */ }
  else if ((el = q('[data-charopen]'))) { openModal('char', el.dataset.charopen); return; }
  if (q('[data-weapon]')) { ui.w = { cid: isPcSeat(room, ru.viewer) ? ru.viewer : (room.turn.current && room.chars[room.turn.current]?.side === 'enemy' ? room.turn.current : null), weapons: [], cards: [...ui.sel], targets: [], memo: ui.memo }; openModal('weapon'); return; }
  if (q('[data-handsall]')) { openModal('hands'); return; }
  if (q('[data-deckmenu]')) { openModal('deck'); return; }
  // phones: the board on the page is a preview; tapping it opens the big map
  if (isPhone() && t.closest('#mapP .board')) { openModal('map'); return; }
  if (mapClick(t, room, ru)) return;

  if (commonClick(t, room, ru)) return;

  if (q('[data-opensettings]')) { settingsDialog(room); return; }
  if (q('[data-theme-toggle]')) { U.theme = (U.theme || 'dark') === 'dark' ? 'light' : 'dark'; saveU(); applyTheme(); return; }
  if ((el = q('.mnav [data-pane]'))) {
    ru.pane = el.dataset.pane; renderRoom();
    if (ru.pane === 'chat') { const box = $('chatLog'); box.scrollTop = box.scrollHeight; }
    window.scrollTo(0, 0); return;
  }
  // chat
  if ((el = q('[data-tab]'))) { ru.tab = el.dataset.tab; renderRoom(); return; }
  if (q('[data-addtab]')) { tabDialog(room, ru); return; }
  if ((el = q('[data-edittab]'))) { tabDialog(room, ru, el.dataset.edittab); return; }
});
document.addEventListener('change', e => {
  const room = curRoom(); if (!room || !e.target.isConnected || e.target.closest('dialog')) return;
  const t = e.target;
  if (t.matches('[data-vset]')) act({ type: 'setValue', cid: t.dataset.cid, key: t.dataset.key, value: t.value });
  if (t.matches('[data-variation]')) act({ type: 'variation', cid: t.dataset.variation, idx: +t.value });
  if (t.matches('[data-used]')) act({ type: 'toggleUsed', cid: t.dataset.used, group: t.dataset.group, idx: +t.dataset.idx });
});
document.addEventListener('input', e => { if (e.target.id === 'memo') ui.memo = e.target.value; });
document.addEventListener('toggle', e => {
  const d = e.target; if (!(d instanceof HTMLDetailsElement) || !d.dataset.sheet) return;
  if (d.open) ui.openSheets.add(d.dataset.sheet); else ui.openSheets.delete(d.dataset.sheet);
}, true);

function applyTheme() {
  const t = U.theme || 'dark';
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.textContent = t === 'dark' ? '明るい表示' : '暗い表示');
}
function render() { applyTheme(); if (ONLINE) netConnect(); const r = route(); if (r.view === 'room') renderRoom(); else renderList(); }
window.addEventListener('hashchange', () => {
  ui.sel = []; ui.selTok = null; ui.history = [];
  if (ONLINE && route().view !== 'room') { NET.roomId = null; DB.rooms = {}; }
  render();
});
render();
</script>
</body>
</html>

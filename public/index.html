<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--PW_ONLINE-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>プリンセスウイング卓（ローカル版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===== tokens =====
   Clear steps: page (darkest) -> panel -> inside a panel (lightest of the three).
   The board is a bright window of sky inside the dark UI: the one memorable element. */
:root{
  --sky:#0A0D1E; --cloud:#1B2246; --mist:#2B3460; --line:#3E4A80;
  --ink:#F3F5FF; --ink-2:#AEB7DD;
  --pink:#FF5C96; --pink-ink:#FFFFFF; --pink-soft:#4A2246;
  --gold:#FFC24B; --void:#3A2F86; --void-2:#A595FF;
  --board:#F4F8FF; --cell:#E2ECFA; --cell-2:#C8D9F1; --cell-ink:#4A5A8C; --cell-line:#B3C6E4;
  --red:#FF6B87; --ok:#36D49A; --ng:#FF6B87;
  --shadow:0 20px 44px -22px rgba(0,0,0,.85);
  --num:"Chakra Petch","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --sky:#C9D4E8; --cloud:#FFFFFF; --mist:#EAF0F8; --line:#C2CEE2;
  --ink:#121A38; --ink-2:#4E5A80;
  --pink:#E23C79; --pink-ink:#FFFFFF; --pink-soft:#FBE0EA;
  --gold:#E5A021; --void:#3A2F86; --void-2:#5B4FB0;
  --board:#1B2246; --cell:#E2ECFA; --cell-2:#C8D9F1; --cell-ink:#4A5A8C; --cell-line:#B3C6E4;
  --red:#D02F4E; --ok:#14966A; --ng:#D02F4E;
  --shadow:0 18px 40px -24px rgba(18,26,56,.55);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sky);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-weight:500;line-height:1.6;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
#app{max-width:1480px;margin:0 auto;padding:10px 14px 80px}
h1{font-size:1.3rem;font-weight:800;margin:0;letter-spacing:.02em}
h2{font-size:.9rem;font-weight:800;color:var(--ink);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2 .grow{flex:1}
.muted{color:var(--ink-2);font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

/* buttons: pink = the one main action, ghost = everything else */
.btn{border:1.5px solid var(--line);background:var(--mist);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.9rem;line-height:1.4}
.btn:hover:not(:disabled){border-color:var(--ink-2)}
.btn.primary{background:var(--pink);border-color:var(--pink);color:var(--pink-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn.small{padding:2px 11px;font-size:.82rem}
.btn.ghost{background:transparent}
.top .btn.ghost,.top .back{border-color:var(--line);color:var(--ink-2)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.38;cursor:default}
input[type=text],input[type=number],select,textarea{border:1.5px solid var(--line);background:var(--mist);border-radius:10px;padding:5px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pink)}

/* header */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0 12px}
.top .grow{flex:1}
.back{text-decoration:none;color:var(--ink-2);font-weight:700;font-size:.85rem;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line)}
.back:hover{border-color:var(--ink-2)}
.viewsel{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;color:var(--ink-2)}
.viewsel select{font-weight:700;color:var(--ink)}

/* layout: chat is a first-class column for text sessions.
   Wide screens: header + board on the left, chat runs the full height on the right. */
.mainPane{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--cloud);border-radius:18px;padding:14px}
@media (min-width:960px){
  #roomShell{display:grid;grid-template-columns:minmax(0,1fr) minmax(480px,54%);grid-template-rows:auto 1fr;column-gap:18px;align-items:start}
  #roomShell .layout{display:contents}
  #roomShell .top{grid-column:1;grid-row:1}
  .mainPane{grid-column:1;grid-row:2}
  .chatPane{grid-column:2;grid-row:1 / span 2;position:sticky;top:10px;height:calc(100dvh - 20px)}
  .mnav{display:none}
}
@media (min-width:1500px){ #app{max-width:1600px} #roomShell{grid-template-columns:minmax(0,1fr) minmax(640px,56%)} }
/* phones: one pane at a time, switched from the bottom bar */
@media (max-width:959px){
  #roomShell[data-pane="board"] .chatPane{display:none}
  #roomShell[data-pane="chat"] .mainPane{display:none}
  #roomShell[data-pane="board"]{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  #roomShell[data-pane="chat"]{display:flex;flex-direction:column;height:calc(100dvh - 86px - env(safe-area-inset-bottom,0px))}
  #roomShell[data-pane="chat"] .layout{flex:1;min-height:0;display:flex}
  #roomShell[data-pane="chat"] .chatPane{flex:1;min-height:0;display:flex}
  #roomShell[data-pane="chat"] .chat{flex:1}
  #app:has(#roomShell[data-pane="chat"]){padding-bottom:0}
  .top{gap:8px;padding:2px 0 8px;flex-wrap:nowrap}
  .top h1{font-size:1.05rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .grow{display:none}
  .viewsel{margin-left:auto}
  .viewsel select{max-width:38vw}
  #undoBtn,#setBtn{display:none}
  .mnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr;gap:8px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cloud);box-shadow:0 -8px 24px -16px rgba(14,21,48,.5)}
  .mnav button{border:none;background:transparent;border-radius:999px;padding:9px 0;font-weight:800;font-size:.95rem;color:var(--ink-2);position:relative}
  .mnav button[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
  .mnav .badge{background:var(--gold) !important;color:#2A1C00 !important}
  .mnav .badge{position:absolute;top:2px;right:calc(50% - 4.2em);min-width:20px;height:20px;border-radius:10px;background:var(--pink);color:#fff;font-size:.72rem;line-height:20px;padding:0 6px;font-family:var(--num)}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
/* ===== map: floats on the sky, no card around it ===== */
.skyP{padding:2px 0 6px}
.turnbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.turnbar:empty{display:none}
.roundTag{font-weight:800;font-size:.95rem;color:var(--ink)}
.roundTag b{font-family:var(--num);font-size:1.4rem;margin:0 2px;vertical-align:-1px}
.mapwrap{display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;align-items:start}
.board{display:grid;grid-template-columns:20px repeat(8,1fr);grid-template-rows:repeat(8,1fr) 18px;gap:0;aspect-ratio:1/1;max-width:560px;margin:0 auto;user-select:none;
  background:var(--board);border-radius:16px;padding:8px;box-shadow:var(--shadow)}
.cell{position:relative;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:2px;min-width:0;min-height:0;
  background:var(--cell);border-right:1px solid var(--cell-line);border-bottom:1px solid var(--cell-line)}
.cell.alt{background:var(--cell-2)}
.cell.target{cursor:pointer}
@media (hover:hover){.cell.target:hover{background:#FFD3E3}}
.cell .dist{position:absolute;right:3px;bottom:1px;font-family:var(--num);font-size:.68rem;font-weight:700;color:var(--cell-ink)}
.coord{display:flex;align-items:center;justify-content:center;font-family:var(--num);font-size:.72rem;font-weight:700;color:var(--cell-ink)}
:root[data-theme="light"] .coord{color:#C8D4F0}
.tok{width:min(84%,50px);aspect-ratio:1/1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:clamp(.6rem,2.2vw,.9rem);
  border:3px solid #FFFFFF;box-shadow:0 3px 8px rgba(10,13,30,.45);overflow:hidden;white-space:nowrap;position:relative;z-index:1}
.cell.multi .tok{width:46%;border-width:2px}
.tok.enemy{background:var(--void);border-color:#1A1440}
.tok.sel{box-shadow:0 0 0 4px var(--gold),0 3px 8px rgba(10,13,30,.45)}
.tok.down{filter:grayscale(.9);opacity:.55}
/* a value changed with ± and about to be sent */
.ostat b.draft{color:var(--gold)}
/* round draw / exchange: a line in the tray for whoever still has to do it */
.trayRow .btn.roundAct{background:var(--gold);border-color:var(--gold);color:#2A1C00;font-weight:800;white-space:nowrap;animation:turnTag 1.6s ease-in-out infinite}
.trayRow .btn.roundAct.trade{background:#5DADEC;border-color:#5DADEC;color:#06223A}
.roundAct:disabled{animation:none;opacity:.75}
@media (prefers-reduced-motion:reduce){ .roundAct{animation:none} }
.pendTag{align-self:flex-start;font-size:.6rem;font-weight:800;line-height:1.5;padding:0 6px;border-radius:4px;background:var(--gold);color:#2A1C00}
.rbPend{display:block;font-size:.68rem;font-weight:700;color:#B26A00;margin-top:1px}
.htab.need:not(.on){border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
/* 台詞「」: dialogue in a bubble of the speaker's colour, action lines (ト書き) quieter beneath */
.speech{display:grid;gap:4px;margin-top:2px;justify-items:start}
.speech .sline{position:relative;font-size:1.05em;line-height:1.7;padding:7px 15px 8px;margin-left:7px;border-radius:12px;white-space:pre-wrap;word-break:break-word;max-width:calc(100% - 7px);
  --bf:color-mix(in srgb,var(--sc) 20%,var(--mist));--bl:color-mix(in srgb,var(--sc) 55%,var(--line));
  background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 26%,var(--mist)),var(--bf));border:1px solid var(--bl);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 8px -3px rgba(0,0,0,.35)}
/* the tail toward the speaker: a bordered notch at the upper left */
.speech .sline::before,.speech .sline::after{content:"";position:absolute;top:9px;width:0;height:0;border-style:solid}
.speech .sline::before{left:-8px;border-width:6px 8px 6px 0;border-color:transparent var(--bl) transparent transparent}
.speech .sline::after{left:-6.5px;top:10px;border-width:5px 7px 5px 0;border-color:transparent color-mix(in srgb,var(--sc) 25%,var(--mist)) transparent transparent}
.speech .sline .q,#stage .stBubble .q{opacity:.5}
.speech .aline{color:var(--ink-2);font-size:.92em;line-height:1.6;padding-left:10px;border-left:2px solid color-mix(in srgb,var(--sc) 40%,var(--line));white-space:pre-wrap;word-break:break-word}
.checks3{display:grid;gap:6px;margin-top:4px}
.sayAs{font-size:.78rem;font-weight:800;white-space:nowrap;border-radius:999px;padding:2px 10px;color:#fff;background:color-mix(in srgb,var(--sc,#B48CFF) 75%,#141A3A)}
.checks3 .row{align-items:flex-start;gap:8px;font-size:.88rem;line-height:1.5}
/* the stage: the speaker over the board for a few seconds */
#stage{position:fixed;z-index:40;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .3s ease}
#stage.show{opacity:1}
#stage .stPt{position:absolute;left:2%;bottom:0;height:82%;max-width:46%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 8px 18px rgba(10,13,30,.45));animation:stIn .4s cubic-bezier(.2,.9,.2,1)}
/* a novel-game panel: dark glass, the speaker's colour as a stripe and a name plate, a tail toward the portrait */
#stage .stBubble{position:absolute;left:40%;right:3%;bottom:6%;padding:16px 20px 14px 22px;border-radius:14px;color:#F4F5FF;
  background:linear-gradient(180deg,rgba(20,24,52,.94),rgba(12,15,36,.92));border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 4px 0 0 var(--sc),inset 0 1px 0 rgba(255,255,255,.08),0 14px 34px -10px rgba(5,7,20,.7),0 0 0 1px rgba(0,0,0,.25);
  font-size:clamp(.95rem,1.75vw,1.2rem);line-height:1.75;letter-spacing:.02em;white-space:pre-wrap;word-break:break-word;animation:stIn .3s ease-out}
#stage .stBubble::before{content:"";position:absolute;left:-11px;bottom:22px;border-style:solid;border-width:9px 12px 9px 0;border-color:transparent rgba(16,19,44,.94) transparent transparent;filter:drop-shadow(-1px 0 0 rgba(255,255,255,.14))}
#stage .stBubble b{position:absolute;left:14px;top:0;transform:translateY(-55%);font-size:.74em;font-weight:800;letter-spacing:.06em;line-height:1;padding:5px 12px 5px;border-radius:999px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 85%,#fff),var(--sc));color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);box-shadow:0 3px 8px -2px rgba(0,0,0,.45)}
#stage.noPt .stBubble::before{display:none}
#stage.noPt .stBubble{left:3%}
@keyframes stIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ #stage .stPt,#stage .stBubble{animation:none} }
/* GM: which hand the tray plays */
.handTabs{display:inline-flex;gap:5px;flex-wrap:nowrap;min-width:0;overflow-x:auto;scrollbar-width:none;padding:4px 4px 1px 0;margin:-4px 0 -1px}
.handTabs::-webkit-scrollbar{display:none}
.htab{flex:none;border:1px solid var(--line);background:var(--cloud);color:var(--ink-2);border-radius:999px;padding:2px 10px;font-weight:700;font-size:.82rem;white-space:nowrap;cursor:pointer}
.htab b{font-family:var(--num);color:var(--gold);margin-left:5px}
.htab.on{background:var(--pink);border-color:var(--pink);color:#fff}
.htab.on b{color:#fff}
.htab{position:relative}
.htab.turn::after{content:"";position:absolute;top:-3px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px var(--cloud)}
/* 巨大キャラクター: one big piece over 2×2 squares */
.giantBox{position:relative;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2;min-width:0;min-height:0}
.giantBox .tok{pointer-events:auto;cursor:pointer}
.tok.giant{width:min(90%,180px) !important;border-radius:22%;border-width:4px;font-size:clamp(.9rem,3.4vw,1.5rem) !important}
.cell.covered{background-image:linear-gradient(color-mix(in srgb,#FF5C5C 12%,transparent),color-mix(in srgb,#FF5C5C 12%,transparent))}
.giantBox .cfx{position:absolute;top:4px;right:4px;min-width:17px;height:17px;border-radius:9px;background:#7C5CFF;color:#fff;font-size:.62rem;font-weight:800;line-height:17px;text-align:center;padding:0 4px;box-shadow:0 0 0 2px #fff;z-index:3;pointer-events:none}
.mactions [data-setsize].on{border-color:#FF7A7A;color:#FF7A7A;background:color-mix(in srgb,#FF7A7A 14%,transparent)}
.tok img{width:100%;height:100%;object-fit:cover;object-position:top}
.mapbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;max-width:620px;margin-left:auto;margin-right:auto}

/* turn order list (left of the map) */
.order{display:flex;flex-direction:column;gap:6px;max-height:640px;overflow:auto;padding:2px}
.oitem{display:grid;grid-template-columns:32px 1fr auto;column-gap:8px;align-items:center;text-align:left;border:none;background:var(--cloud);color:var(--ink);border-radius:12px;padding:6px 8px;min-width:0;position:relative}
.oitem::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--pink)}
.oitem.enemy::before{background:var(--void)}
.oitem .pt{width:32px;height:32px;grid-row:1/3;border-radius:50%}
.oitem .oname{font-weight:800;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.oitem .ometa{font-family:var(--num);font-size:.74rem;font-weight:600;color:var(--ink-2);white-space:nowrap;grid-column:2}
.oitem .oset{grid-row:1/3;grid-column:3;color:var(--ink-2);padding:2px 6px;border-radius:8px;font-size:.8rem}
.oitem .oset:hover{background:var(--pink-soft);color:var(--pink)}
.oitem.now{box-shadow:inset 0 0 0 2px var(--gold);background:var(--mist)}
.oitem:hover{background:var(--mist)}
.oitem.now::after{content:"手番";position:absolute;top:-7px;right:8px;font-size:.66rem;font-weight:800;color:#4A3000;background:var(--gold);border-radius:999px;padding:0 8px;line-height:1.6}
.oitem.sel{outline:2px dashed var(--gold);outline-offset:1px}
@media (max-width:0px){
  .mapwrap{grid-template-columns:1fr}
  .order{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:4px}
  .oitem{min-width:160px}
}

/* ===== hand tray: navy, cards pop ===== */
.tray{background:var(--cloud);color:var(--ink);border-radius:18px;padding:14px 16px 16px}
.tray h2{color:var(--ink)}
.tray .muted{color:var(--ink-2)}
.tray .btn{background:var(--mist);color:var(--ink);border-color:var(--line)}
.tray .btn:hover:not(:disabled){border-color:var(--ink-2)}
.tray .btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.tray .btn.danger{color:var(--red)}
.tray input[type=text]{background:var(--mist);border-color:var(--line);color:var(--ink)}
.tray input::placeholder{color:var(--ink-2)}
.handHead{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.handHead b{font-weight:800}
.handHead .count{font-family:var(--num);font-weight:700;color:var(--gold)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{width:52px;height:74px;border-radius:8px;border:none;background:#FFFFFF;color:#1B2547;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--num);font-weight:700;line-height:1;padding:0;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.18);transition:transform .12s}
.card .r{font-size:1.25rem} .card .s{font-size:1.3rem;margin-top:2px}
.card.red{color:#D7334E}
.card.joker{color:#6A4CD6;font-size:.62rem;letter-spacing:.04em}
.card.sel{transform:translateY(-8px);box-shadow:0 0 0 3px var(--gold),0 6px 0 rgba(0,0,0,.18)}
.card.mini{width:32px;height:46px;border-radius:6px;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.card.mini .r{font-size:.85rem}.card.mini .s{font-size:.85rem;margin-top:1px}
/* card back: princess-pink with a wing-like chevron weave */
.card.back{background:
  repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.28) 5px 7px),
  repeating-linear-gradient(45deg,transparent 0 5px,rgba(255,255,255,.28) 5px 7px),
  var(--pink);box-shadow:inset 0 0 0 2px #fff,0 2px 0 rgba(0,0,0,.18)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.actions .btn{padding:9px 6px;font-size:.92rem}
.memo{width:100%;margin-top:12px}
.otherHands{margin-top:16px;padding:12px;border-radius:14px;background:var(--mist);display:grid;gap:12px}
.who2{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.86rem;margin-bottom:5px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--pink)}
.dot.gm{background:var(--void-2)}
.chip{display:inline-flex;align-items:center;padding:0 7px;border-radius:6px;background:#fff;border:1px solid var(--line);font-family:var(--num);font-weight:700;color:#1B2547;font-size:.88rem;line-height:1.6}
.chip.red{color:#D7334E}

/* ===== chat: white sheet ===== */
.chat{padding:12px 14px 12px;height:100%;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:-2px -2px 10px;padding:2px}
.tab{border:none;background:transparent;border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap;font-size:.86rem;color:var(--ink-2)}
.tab:hover{background:var(--mist)}
.tab[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
.tab.secret{box-shadow:inset 0 0 0 1.5px var(--void-2)}
.tab.secret[aria-pressed="true"]{background:var(--void-2);box-shadow:none;color:#120E33}
.tab .lock{font-size:.7rem;margin-left:4px;opacity:.85}
.log{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 6px 4px 0;font-size:.98rem}
.msg{display:flex;gap:10px;align-items:flex-start}
.pt{width:48px;height:48px;border-radius:14px;object-fit:cover;object-position:top;flex:none;background:var(--mist)}
.pt.none{display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:.9rem}
.mbody{min-width:0;flex:1}
.mname{font-weight:800;font-size:.86rem}
.mname .t,.le .t{color:var(--ink-2);font-family:var(--num);font-size:.7rem;font-weight:500;margin-left:8px}
.mtext{white-space:pre-wrap;word-break:break-word;line-height:1.75}
.dice{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:6px;background:var(--mist);border-left:4px solid var(--line);border-radius:4px 12px 12px 4px;padding:7px 12px}
.dice.ok{border-left-color:var(--ok)} .dice.ng{border-left-color:var(--ng)}
.dice .dres{font-family:var(--num);font-size:.82rem;font-weight:600;color:var(--ink-2);word-break:break-all}
.dice .dtotal{font-family:var(--num);font-size:1.5rem;font-weight:700;margin-left:auto;line-height:1;color:var(--ink)}
.dice .dverdict{font-weight:800;font-size:.78rem;border-radius:999px;padding:1px 9px;background:var(--line);color:var(--ink)}
.dice.ok .dverdict{background:var(--ok);color:#fff} .dice.ng .dverdict{background:var(--ng);color:#fff}
.dice .dverdict.s{background:var(--void);color:#fff}
.dice.secret{box-shadow:inset 0 0 0 1.5px var(--void-2)}
/* a fresh roll: the total spins, then lands with the verdict */
.dice.rolling .dverdict,.dice.rolling .dzoro{visibility:hidden}
.dice.rolling .dres{opacity:.25}
.dice.rolling .dtotal{animation:dShake .11s linear infinite;color:var(--ink-2)}
.dice.landed .dtotal{animation:dPop .4s cubic-bezier(.2,1.6,.4,1)}
.dice.landed .dverdict,.dice.landed .dzoro{animation:dPop .35s .05s cubic-bezier(.2,1.6,.4,1) both}
.dice.landed.ok{animation:dOk 1.1s ease-out}
.dice.landed.ng{animation:dNg .9s ease-out}
.dice.crit{border-left-color:var(--gold);background:linear-gradient(100deg,color-mix(in srgb,var(--gold) 22%,var(--mist)),var(--mist) 70%)}
.dice.crit{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--gold) 70%,transparent)}
.dice.fumble{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,#6B4FA8 70%,transparent)}
.dice.fumble{border-left-color:#6B4FA8;background:linear-gradient(100deg,color-mix(in srgb,#6B4FA8 22%,var(--mist)),var(--mist) 70%)}
.dice .dzoro{font-weight:900;font-size:.78rem;border-radius:999px;padding:1px 9px;background:var(--gold);color:#4A3000}
.dice.fumble .dzoro{background:#6B4FA8;color:#fff}
.dice.landed.crit{animation:dCrit 1.4s ease-out}
.dice.landed.crit .dtotal{animation:dPop .5s cubic-bezier(.2,1.8,.4,1);color:var(--gold);text-shadow:0 0 10px var(--gold)}
.dice.landed.fumble .dtotal{animation:dDrop .6s ease-out}
@keyframes dShake{0%{transform:translateY(-2px) rotate(-6deg)}50%{transform:translateY(2px) rotate(6deg)}100%{transform:translateY(-2px) rotate(-6deg)}}
@keyframes dPop{0%{transform:scale(1.7);opacity:.3}100%{transform:none;opacity:1}}
@keyframes dDrop{0%{transform:translateY(-10px);opacity:.3}60%{transform:translateY(3px)}100%{transform:none;opacity:1}}
@keyframes dOk{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes dNg{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}}
@keyframes dCrit{0%{box-shadow:0 0 0 0 var(--gold),0 0 24px var(--gold)}100%{box-shadow:0 0 0 16px transparent,0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){ .dice.rolling .dtotal,.dice.landed,.dice.landed *{animation:none !important} }

/* HP bar: red at half or less */
.ostat.low .bar span{background:#F0505A}
.ostat.crit .bar span{background:#FF2E4D}
.ostat.low b,.ostat.crit b{color:#FF5A6E}
.hpLow{color:#FF5A6E;font-weight:800}
.oitem .oset{top:8px !important;bottom:auto !important;right:4px !important;font-size:.7rem;padding:0 3px}
.oitem .otext{padding-right:14px}

/* tabs never push the chat wider than its column */
.chatPane,.chat{min-width:0}
.tabs{min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
.tab{flex:none;max-width:11em;overflow:hidden;text-overflow:ellipsis}
.composer,.speak{min-width:0}
.speak select{min-width:0}
/* typing line */
.typing{height:1.5em;line-height:1.5em;font-size:.74rem;color:#9A9A9E;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transform:translateY(3px);transition:opacity .25s ease,transform .25s ease}
.typing.on{opacity:1;transform:none}
.typing .tpen{margin-right:4px}
.typing .tdots{display:inline-flex;gap:2px;margin-left:3px;vertical-align:middle}
.typing .tdots i{width:3px;height:3px;border-radius:50%;background:currentColor;animation:tdot 1.2s infinite ease-in-out}
.typing .tdots i:nth-child(2){animation-delay:.15s}
.typing .tdots i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.typing{transition:none}.typing .tdots i{animation:none;opacity:.7}}
/* links / BGM */
.linkRow{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.linkRow > div{flex:1;min-width:0}
.linkRow p{margin:2px 0 0;font-size:.8rem}
.bgmBtn.on{border-color:var(--pink) !important;color:var(--pink) !important}
.bgmBtn.blocked{animation:blink 1.2s infinite}
input[type=range]{width:100%;accent-color:var(--pink)}
.formNote{font-size:.74rem;font-weight:700;color:var(--gold);margin-left:6px}
.formNote.on{color:var(--ok)}
.swapPics{display:inline-flex;align-items:center;gap:4px;margin-left:8px;vertical-align:middle;color:#9A9A9E}
.swapPics img{width:24px;height:32px;object-fit:cover;object-position:top;border-radius:3px}
.ptFormsH{font-size:.95rem;margin:16px 0 2px}
.ptForms{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.ptFormRow{display:grid;grid-template-columns:minmax(0,1fr) 36px minmax(0,1.2fr);align-items:center;gap:8px}
.ptFormRow .fname{font-weight:700;font-size:.86rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptFormRow img,.ptFormRow .ptNone{width:36px;height:48px;object-fit:cover;object-position:top;border-radius:4px;background:var(--mist);display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.ptFormRow select{min-width:0;width:100%}

/* ===== effects: 換装 / WING DRIVE (transform + opacity only) ===== */
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;display:flex;align-items:center;justify-content:center;overflow:hidden}
.fxBurst{position:absolute;width:140vmax;height:140vmax;border-radius:50%;background:radial-gradient(circle, color-mix(in srgb, var(--fxc) 55%, #fff) 0%, transparent 55%);opacity:0;transform:scale(.1);animation:fxBurst 1.2s ease-out forwards}
.fxText{position:relative;text-align:center;color:#fff;text-shadow:0 0 12px var(--fxc),0 0 2px #000;opacity:0;animation:fxText 2.2s ease-out forwards}
.fxText b{display:block;font-family:var(--num);font-size:clamp(2rem,7vw,4.2rem);letter-spacing:.18em;font-weight:700}
.fxText b.long{font-size:clamp(1.6rem,5vw,3.2rem);letter-spacing:.06em}
.fxText span{display:block;font-size:clamp(.9rem,2.4vw,1.3rem);font-weight:800;margin-top:4px}
.fxPt{position:absolute;height:min(70vh,520px);opacity:0;animation:fxPt 2.2s ease-out forwards;filter:drop-shadow(0 0 18px var(--fxc))}
.fxWing{display:none}
.fx-wd .fxWing{display:block;position:absolute;top:50%;width:60vw;height:38vh;margin-top:-19vh;opacity:0;
  background:repeating-linear-gradient(100deg, transparent 0 18px, color-mix(in srgb, var(--fxc) 70%, #fff) 18px 22px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 40%,transparent);mask-image:linear-gradient(90deg,transparent,#000 40%,transparent)}
.fx-wd .fxWing.l{right:50%;transform-origin:right center;animation:wingL 1.6s ease-out forwards}
.fx-wd .fxWing.r{left:50%;transform-origin:left center;animation:wingR 1.6s ease-out forwards}
@keyframes fxBurst{20%{opacity:.85}100%{opacity:0;transform:scale(1)}}
@keyframes fxText{0%{opacity:0;transform:translateY(16px) scale(.96)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes fxPt{0%{opacity:0;transform:translateX(-40px) scale(.95)}20%{opacity:.9;transform:none}75%{opacity:.9}100%{opacity:0;transform:translateX(30px)}}
@keyframes wingL{0%{opacity:0;transform:rotate(18deg) scaleX(.2)}30%{opacity:.9;transform:rotate(-6deg) scaleX(1)}100%{opacity:0;transform:rotate(-14deg) scaleX(1.05)}}
@keyframes wingR{0%{opacity:0;transform:rotate(-18deg) scaleX(.2)}30%{opacity:.9;transform:rotate(6deg) scaleX(1)}100%{opacity:0;transform:rotate(14deg) scaleX(1.05)}}

/* phones: one tight header row; icons instead of words */
.top .btn{white-space:nowrap}
@media (max-width:959px){
  .top{gap:6px}
  .top .back{padding:3px 8px;font-size:.78rem}
  .top [data-menu],.top .bgmBtn{font-size:0 !important;padding:3px 9px !important;min-width:32px}
  .top [data-menu]::before{content:"≡";font-size:1rem;font-weight:800}
  .top .bgmBtn::before{content:"♪";font-size:.95rem;font-weight:800}
  .top [data-links]{padding:3px 8px;font-size:.76rem}
  .viewsel{font-size:0}
  .viewsel select{font-size:.8rem;max-width:34vw}
}
@media (max-width:720px){
  .ohd{flex-direction:column}
  .ohd .btn{font-size:.62rem;padding:2px 4px;white-space:nowrap}
}

/* the effect layer is a popover: strip the browser's default popover box */
.fx[popover]{margin:0;padding:0;border:none;background:transparent;width:100vw;height:100vh;max-width:none;max-height:none;inset:0;overflow:hidden}
.fx:popover-open{display:flex}
/* still effect: same picture as the animation, it only fades in and out (for "reduce motion" or by choice) */
.fx-simple{align-items:flex-start;padding-top:18vh}
.fxCard{display:flex;align-items:center;gap:16px;background:rgba(10,13,30,.92);border:2px solid var(--fxc);border-radius:16px;padding:14px 22px;box-shadow:0 0 0 4px rgba(0,0,0,.3),0 0 30px var(--fxc);color:#fff}
.fxCard img{width:72px;height:96px;object-fit:cover;object-position:top;border-radius:8px}
.fxCard b{display:block;font-family:var(--num);font-size:1.8rem;letter-spacing:.14em}
.fxCard span{display:block;font-weight:800;margin-top:2px}

/* no scrollbars on the map or the tab strip */
.boardBox,dialog.mapDlg,.tabs{scrollbar-width:none}
.boardBox::-webkit-scrollbar,dialog.mapDlg::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.boardBox.panning,dialog.mapDlg.panning{cursor:grabbing}
.boardBox.panning *{cursor:grabbing !important}
.tabsWrap{display:flex;align-items:center;gap:2px;min-width:0;border-bottom:1px solid rgba(255,255,255,.12);margin:-2px -12px 0;padding:2px 6px 8px}
.tabsWrap .tabs{flex:1;border-bottom:none !important;margin:0 !important;padding:2px 2px 0 !important}
/* tabs inside the input area: a slim row above the speaker select, separated by a hairline below */
.tabsWrap.inComposer{margin:-4px -2px 8px;padding:0 0 8px;border-bottom:1px solid rgba(255,255,255,.1)}
.tabArrow{flex:none;width:26px;height:26px;border-radius:999px;border:1px solid #4A4C52;background:#36383D;color:#fff;font-weight:800;cursor:pointer;line-height:1}
.tabArrow:hover{border-color:var(--pink)}


.fx-simple .fxBurst{opacity:.75;transform:scale(1);animation:fxFade 2.4s ease forwards}
.fx-simple .fxPt{opacity:.9;transform:none;animation:fxFade 2.4s ease forwards}
.fx-simple .fxText{opacity:1;transform:none;animation:fxFade 2.4s ease forwards}
.fx-simple.fx-wd .fxWing{opacity:.8;animation:fxFade 2.4s ease forwards}
.fx-simple.fx-wd .fxWing.l{transform:rotate(-6deg)} .fx-simple.fx-wd .fxWing.r{transform:rotate(6deg)}
@keyframes fxFade{0%{opacity:0}12%{opacity:1}78%{opacity:1}100%{opacity:0}}
.formBar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.formNow{font-size:.78rem;font-weight:800;color:var(--ok);padding:2px 10px;border:1.5px solid var(--ok);border-radius:999px}
.fx.fx-simple{align-items:center !important;padding-top:0 !important}

/* flowing effect: portrait sweeps in from the left, title from the right, a light streak runs across (vw units, same on PC and phone) */
.fxStreak{position:absolute;left:0;top:50%;width:100vw;height:22vh;margin-top:-11vh;
  background:linear-gradient(90deg,transparent 0%,color-mix(in srgb,var(--fxc) 60%,#fff) 45%,#fff 50%,color-mix(in srgb,var(--fxc) 60%,#fff) 55%,transparent 100%);
  opacity:0;transform:translateX(-100vw) skewX(-20deg);animation:fxStreak 1.1s cubic-bezier(.2,.7,.2,1) forwards;mix-blend-mode:screen}
@keyframes fxStreak{0%{opacity:0;transform:translateX(-100vw) skewX(-20deg)}20%{opacity:.85}100%{opacity:0;transform:translateX(100vw) skewX(-20deg)}}
.fx-anim .fxPt{animation:fxPtFlow 2.3s cubic-bezier(.2,.8,.2,1) forwards}
.fx-anim .fxText{animation:fxTextFlow 2.3s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fxPtFlow{0%{opacity:0;transform:translateX(-60vw)}22%{opacity:.95;transform:translateX(-6vw)}72%{opacity:.95;transform:translateX(2vw)}100%{opacity:0;transform:translateX(60vw)}}
@keyframes fxTextFlow{0%{opacity:0;transform:translateX(45vw)}22%{opacity:1;transform:translateX(3vw)}72%{opacity:1;transform:translateX(-2vw)}100%{opacity:0;transform:translateX(-45vw)}}
.fx-simple .fxStreak{display:none}

/* 換装 with a new 立ち絵: before → white-out → flash, ring and sparks → after (3.2 s) */
.fx-swap{--sw:3.2s}
.swShade{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(5,8,20,.25),rgba(5,8,20,.72));opacity:0;animation:swShade var(--sw) ease forwards}
.swStage{position:relative;height:min(66vh,520px);aspect-ratio:3/4;max-width:92vw}
.swStage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;opacity:0}
.swOld{animation:swOld var(--sw) ease forwards}
.swNew{animation:swNew var(--sw) ease forwards}
.swFlash{position:absolute;left:50%;top:50%;width:40%;aspect-ratio:1;margin:-20% 0 0 -20%;border-radius:50%;background:radial-gradient(circle,#fff 0%,color-mix(in srgb,var(--fxc) 60%,#fff) 35%,transparent 70%);opacity:0;animation:swFlash var(--sw) ease-out forwards}
.swRing{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border-radius:50%;border:3px solid color-mix(in srgb,var(--fxc) 55%,#fff);box-shadow:0 0 24px var(--fxc),inset 0 0 24px var(--fxc);opacity:0;animation:swRing var(--sw) ease-out forwards}
.swRing.r2{animation-delay:.14s;border-width:2px}
.swSparks{position:absolute;left:50%;top:50%;width:0;height:0}
.swSparks i{position:absolute;left:-3px;top:-14px;width:6px;height:28px;border-radius:3px;background:linear-gradient(#fff,var(--fxc));opacity:0;transform:rotate(var(--a));animation:swSpark var(--sw) ease-out forwards;animation-delay:var(--d)}
.fx-swap .swText{position:absolute;bottom:9vh;left:0;right:0;animation:swText var(--sw) ease-out forwards}
.fx-swap .fxBurst{animation:swBurst var(--sw) ease-out forwards}
@keyframes swShade{0%{opacity:0}10%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes swOld{0%{opacity:0;transform:translateX(-5%) scale(.97)}12%{opacity:1;transform:none;filter:none}28%{opacity:1;transform:scale(1.02);filter:brightness(1.3) drop-shadow(0 0 12px var(--fxc))}40%{opacity:1;transform:scale(1.05);filter:brightness(4) saturate(0) drop-shadow(0 0 30px #fff)}47%{opacity:0;transform:scale(1.12);filter:brightness(5) saturate(0)}100%{opacity:0}}
@keyframes swNew{0%,41%{opacity:0;transform:scale(1.14);filter:brightness(5) saturate(0)}50%{opacity:1;transform:scale(1.04);filter:brightness(3) saturate(.3) drop-shadow(0 0 30px #fff)}64%{opacity:1;transform:none;filter:brightness(1) drop-shadow(0 0 16px var(--fxc))}88%{opacity:1;transform:none;filter:drop-shadow(0 0 10px var(--fxc))}100%{opacity:0;transform:translateY(-2%);filter:none}}
@keyframes swFlash{0%,36%{opacity:0;transform:scale(.2)}44%{opacity:1;transform:scale(2.6)}60%{opacity:0;transform:scale(5)}100%{opacity:0}}
@keyframes swRing{0%,38%{opacity:0;transform:scale(.2)}46%{opacity:1}76%{opacity:0;transform:scale(2.6)}100%{opacity:0}}
@keyframes swSpark{0%,40%{opacity:0;transform:rotate(var(--a)) translateY(0) scaleY(.4)}48%{opacity:1}76%{opacity:0;transform:rotate(var(--a)) translateY(-36vmin) scaleY(1)}100%{opacity:0}}
@keyframes swText{0%,44%{opacity:0;transform:translateY(14px) scale(.96)}54%{opacity:1;transform:none}88%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
@keyframes swBurst{0%,38%{opacity:0;transform:scale(.1)}48%{opacity:.8}80%{opacity:0;transform:scale(1)}100%{opacity:0}}
/* still version (reduce motion / 簡易表示): a plain cross-fade from before to after */
.fx-swap.fx-simple .swRing,.fx-swap.fx-simple .swSparks,.fx-swap.fx-simple .swFlash,.fx-swap.fx-simple .fxBurst{display:none}
.fx-swap.fx-simple .swOld{animation:swOldS var(--sw) ease forwards}
.fx-swap.fx-simple .swNew{animation:swNewS var(--sw) ease forwards}
.fx-swap.fx-simple .swText{opacity:1;transform:none;animation:fxFade var(--sw) ease forwards}
@keyframes swOldS{0%{opacity:0}10%{opacity:1}35%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes swNewS{0%,35%{opacity:0}50%{opacity:1}88%{opacity:1}100%{opacity:0}}

/* a reserved place for a button that is not usable right now (keeps the layout from shifting) */
.btn.slot{visibility:hidden;pointer-events:none}
/* hand tray (all widths): other people's counts, deck / discard with its top card */
.card .s2{display:none}
.tray .count small{font-size:.7em;margin-left:1px;color:var(--ink-2)}
.piles{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.piles b{font-family:var(--num);color:var(--gold);margin:0 4px 0 1px}
.piles .chip{font-size:.78rem;line-height:1.5;padding:0 5px}
.handOthers{display:flex;align-items:center;gap:6px;width:100%;margin:2px 0 8px;padding:4px 2px;border:none;background:none;color:var(--ink-2);font:inherit;font-size:.78rem;cursor:pointer;overflow-x:auto;white-space:nowrap;scrollbar-width:none;text-align:left}
.handOthers::-webkit-scrollbar{display:none}
.handOthers .ho{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--mist);color:var(--ink);font-weight:700;flex:none}
.handOthers .ho i{width:8px;height:8px;border-radius:50%;flex:none}
.handOthers .ho i.gm{background:var(--gold)}
.handOthers .ho b{font-family:var(--num);color:var(--gold)}
.handOthers .ho .hn{max-width:6.5em;overflow:hidden;text-overflow:ellipsis}
.handOthers .hoMore{margin-left:auto;padding-left:6px;flex:none}
.handOthers:hover .hoMore{color:var(--pink)}
.onum{font-family:var(--num);font-size:.62rem;font-weight:700;color:var(--ink-2);min-width:.9em;text-align:center;flex:none}
.phoneTool,.ordToggle{display:none}

/* ===== wide screens: the board column is exactly as wide as the board (plus the zoom strip);
   the turn-order list gets all the rest, in two columns when there is room ===== */
@media (min-width:960px){
  #mapP{container-type:size}
  /* the turn order is one vertical column of a fixed width (the round line and buttons above it share it); the board gets the rest */
  #mapP .mapwrap{grid-template-columns:236px minmax(0,1fr) !important;gap:6px !important}
  #mapP .order{display:grid !important;grid-template-columns:minmax(0,1fr);align-content:start;gap:4px !important;overflow-x:hidden !important}
  #mapP .order > .ohd,#mapP .order > .grp,#mapP .order > p{grid-column:1 / -1}
  .ohd{flex-wrap:nowrap}
  .ohd .btn{flex:none;white-space:nowrap}
  .boardBox .board{margin:0 !important}
}

/* character panel: one sticky title row (name + ✕), the actions on a row of their own below it */
.mhead.charHead{flex-wrap:nowrap !important}
.charHead .mtitle{flex:1;min-width:0}
.charHead .mtitle h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.charHead .swatch{flex:none}
.charHead .mclose{flex:none;width:36px;height:36px;padding:0;border-radius:50%;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.mactions{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.mactions:empty{display:none}
/* the sticky dialog header stays above everything that scrolls under it (order badges, selected weapons, cards) */
dialog .mhead{z-index:8 !important}
.mhead.charHead{box-shadow:0 8px 8px -8px rgba(10,13,30,.35)}
/* phones: name and actions first; the large portrait goes to the end (the small one is in the title row) */
@media (max-width:720px){ .charGrid.hasPt .charSide{order:2 !important;position:static} .charGrid.hasPt .charSide .bigpt{max-width:220px} }

/* weapon range: orange outline on the board, foes within range ringed; the move bar's picker */
.cell.rng{box-shadow:inset 0 0 0 2px #FF9F1C;background-image:linear-gradient(rgba(255,159,28,.16),rgba(255,159,28,.16))}
.cell.rng.reach{background-image:linear-gradient(rgba(255,92,150,.30),rgba(255,92,150,.30))}
.tok.aimed{box-shadow:0 0 0 3px #FF9F1C,0 0 12px 3px rgba(255,159,28,.7) !important}
.rangePick{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--mist);color:var(--ink);font-size:.78rem;font-weight:800;white-space:nowrap;cursor:pointer}
.rangePick.on{background:#FF9F1C;border-color:#FF9F1C;color:#2A1C00}
.rangePick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
/* weapon dialog: a small board with the range, and 射程内/外 on each target */
.rangeBox{display:flex;align-items:center;gap:10px;margin:2px 0 8px;font-size:.78rem}
.rangeMini{display:grid;grid-template-columns:repeat(8,1fr);width:136px;aspect-ratio:1;flex:none;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.rangeMini .rc{display:flex;align-items:center;justify-content:center;background:#E8EEF8;font-size:.55rem;font-weight:800;color:#fff;line-height:1}
.rangeMini .rc.alt{background:#D3DDEE}
.rangeMini .rc.in{background:#FFD08A}
.rangeMini .rc.in.alt{background:#FFC46A}
.rangeMini .rc.me{background:var(--pink);border-radius:50%}
.rangeMini .rc.foe{background:#3B2D7A;border-radius:50%}
.rangeMini .rc.foe.in,.rangeMini .rc.in.foe{box-shadow:0 0 0 2px #FF9F1C inset}
.rangeMini .rc.ally{background:#4FA3E0;border-radius:50%}
.mchip .rtag{font-size:.66rem;font-weight:800;padding:0 6px;border-radius:999px;margin-left:2px}
.mchip.inR .rtag{background:#FF9F1C;color:#2A1C00}
.mchip.outR{opacity:.6}
.mchip.outR .rtag{background:var(--line);color:var(--ink-2)}
/* a joker ready for クロスユニゾン */
.card.joker.unisonOk{box-shadow:0 0 0 2px var(--gold),0 0 12px 2px color-mix(in srgb,var(--gold) 60%,transparent);animation:turnTag 1.6s ease-in-out infinite}
.card .uTag{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:.5rem;font-weight:800;color:#2A1C00;background:var(--gold);border-radius:999px;padding:0 4px;white-space:nowrap;writing-mode:horizontal-tb;letter-spacing:0}
@media (prefers-reduced-motion:reduce){.card.joker.unisonOk{animation:none}}

/* lasting effects: chips on the list card, a count on tokens and on the folded phone strip, the panel section */
.ofx{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.fxc{display:inline-flex;align-items:center;gap:3px;max-width:100%;font-size:.62rem;font-weight:800;line-height:1.5;padding:0 6px;border-radius:999px;background:#E9E2FF;color:#3B2D7A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxc b{color:#B0124F}
.fxc.nextOwn{background:#FFE7C2;color:#6A3B00}
.fxc.round{background:#D7F2E6;color:#14532D}
.fxc.manual{background:#E3E7EF;color:#334}
:root:not([data-theme="light"]) .fxc{background:#3B3170;color:#E9E2FF} :root:not([data-theme="light"]) .fxc b{color:#FFB3CF}
:root:not([data-theme="light"]) .fxc.nextOwn{background:#5A3B12;color:#FFE7C2} :root:not([data-theme="light"]) .fxc.round{background:#174A35;color:#D7F2E6} :root:not([data-theme="light"]) .fxc.manual{background:#3A3F4E;color:#E3E7EF}
.ofxN{display:none}
/* the token clips to its circle, so the count sits on the square's corner */
.cell{position:relative}
.cell .cfx{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:#7C5CFF;color:#fff;font-size:.58rem;font-weight:800;line-height:15px;text-align:center;padding:0 3px;box-shadow:0 0 0 2px #fff;z-index:3;pointer-events:none}

  .mapwrap:not(.ordOpen) .ofxN{display:block;position:absolute;right:0;top:0;min-width:14px;height:14px;border-radius:7px;background:#7C5CFF;color:#fff;font-size:.55rem;font-weight:800;line-height:14px;text-align:center;padding:0 3px}
}

/* initiative: acted characters dim with 済, tied ones glow with a 動く button */
.oitem.acted{opacity:.55}
/* 戦闘不能 (HP 0 or less): out of the initiative, greyed until healed */
.oitem.down{background:color-mix(in srgb,#B3263A 8%,var(--cloud))}
.oitem.down .pt{filter:grayscale(1) brightness(.6)}
.oitem.down .oname,.oitem.down .ometa,.oitem.down .ostat,.oitem.down .onum,.oitem.down .ofx{filter:grayscale(1);opacity:.5}
.oitem.down::before{background:#7A7A7A}

.oitem.down.acted::after{display:none}
.tok.down::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,#E2324A 46% 54%,transparent 54%),linear-gradient(-45deg,transparent 46%,#E2324A 46% 54%,transparent 54%);opacity:.8}

.fx-dd{--ddc:#C21E56}
.fx-dd .ddShade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(60,0,40,.55) 0%,rgba(8,0,14,.92) 60%,#000 100%);animation:ddShade 2.8s ease forwards}
.fx-dd .ddRing{position:absolute;left:50%;top:50%;width:60vmin;height:60vmin;margin:-30vmin;border-radius:50%;border:3px solid var(--ddc);box-shadow:0 0 40px var(--ddc),inset 0 0 40px var(--ddc);opacity:0;animation:ddRing 2.8s ease-out forwards}
.fx-dd .ddWing{position:absolute;top:50%;width:52vw;height:56vh;margin-top:-30vh;opacity:0;
  background:linear-gradient(180deg,#14001E 0%,#2B0033 55%,var(--ddc) 100%);filter:drop-shadow(0 0 18px var(--ddc));
  clip-path:polygon(0 8%,22% 0,40% 14%,58% 2%,76% 18%,100% 30%,100% 44%,84% 46%,96% 64%,74% 60%,82% 84%,58% 70%,60% 100%,38% 76%,30% 92%,18% 64%,4% 72%,10% 44%)}
.fx-dd .ddWing.l{right:50%;transform-origin:right 40%;animation:ddWingL 2.8s cubic-bezier(.2,.9,.2,1) forwards}
.fx-dd .ddWing.r{left:50%;transform-origin:left 40%;animation:ddWingR 2.8s cubic-bezier(.2,.9,.2,1) forwards;clip-path:polygon(100% 8%,78% 0,60% 14%,42% 2%,24% 18%,0% 30%,0% 44%,16% 46%,4% 64%,26% 60%,18% 84%,42% 70%,40% 100%,62% 76%,70% 92%,82% 64%,96% 72%,90% 44%)}
.fx-dd .ddShards{position:absolute;left:50%;top:50%;width:0;height:0}
.fx-dd .ddShards i{position:absolute;left:-3px;top:-16px;width:6px;height:32px;background:linear-gradient(#fff,var(--ddc));clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);opacity:0;animation:ddShard 2.8s ease-out var(--d) forwards}
.fx-dd .ddPt{position:relative;max-height:66vh;max-width:70vw;opacity:0;animation:ddPt 2.8s ease forwards}

.fx-dd .ddText b::before{color:#FF2E6E;transform:translateX(-4px);clip-path:inset(0 0 55% 0)}
.fx-dd .ddText b::after{color:#7A5CFF;transform:translateX(4px);clip-path:inset(55% 0 0 0)}

/* カオティックムーン: a crimson moon rises over the field and rakes it with lasers (3.4 s) */
.fx-moon{overflow:hidden}
.fx-moon .mnShade{position:absolute;inset:0;background:radial-gradient(circle at 50% 20%,rgba(120,0,24,.55),rgba(6,0,10,.88) 65%);animation:mnShade 3.4s ease forwards}
.fx-moon .mnMoon{position:absolute;left:50%;top:20%;width:38vmin;height:38vmin;margin:-19vmin;border-radius:50%;opacity:0;animation:mnMoon 3.4s ease-out forwards;will-change:transform,opacity}
.fx-moon .mnMoon img{position:relative;display:block;width:100%;height:100%}
.mnMoon::before,.jkMoon::before{content:"";position:absolute;inset:-34%;border-radius:50%;background:radial-gradient(circle,rgba(228,42,69,.55) 34%,rgba(200,20,50,.22) 48%,rgba(140,8,30,.08) 60%,transparent 70%)}
.fx-moon .mnMoon::after{content:"";position:absolute;inset:-12%;border-radius:50%;border:2px solid rgba(255,120,140,.6);opacity:0;animation:mnCharge 3.4s ease-out forwards}
/* thick lasers: a white-hot core in a crimson sheath, fading along their length */
/* a laser in three layers — a soft crimson-black sheath, a red body and a hot core — all plain gradients (no filters:
   cheap to animate), drawn over the moon and born inside the muzzle flare so the moon's edge never cuts it */
.fx-moon .mnBeam{position:absolute;height:60px;margin-top:-30px;transform-origin:0 50%;will-change:transform,opacity;
  background:linear-gradient(180deg,transparent 0,rgba(70,0,14,.25) 12%,rgba(110,6,24,.6) 26%,#9A0C24 38%,#D41A34 46%,#FF5A6A 50%,#D41A34 54%,#9A0C24 62%,rgba(110,6,24,.6) 74%,rgba(70,0,14,.25) 88%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 5%,#000 12%,#000 88%,rgba(0,0,0,.55));mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.6) 5%,#000 12%,#000 88%,rgba(0,0,0,.55));
  transform:rotate(var(--a)) scale(0,.5);opacity:0;animation:mnBeam .5s ease-out forwards;animation-delay:var(--d)}
.fx-moon .mnHit{position:absolute;width:24vmin;height:24vmin;margin:-12vmin;border-radius:50%;background:radial-gradient(circle,#FF6A78 0 10%,#E0203A 22%,#7A0618 42%,rgba(40,0,8,0) 70%);opacity:0;animation:mnHit .55s ease-out forwards;animation-delay:var(--d)}
.fx-moon .mnShake{position:absolute;inset:0;animation:mnShake 3.4s linear forwards;will-change:transform}
.fx-moon .mnMuzzle{position:absolute;width:16vmin;height:16vmin;margin:-8vmin;border-radius:50%;will-change:transform,opacity;
  background:radial-gradient(circle,rgba(255,110,120,.95) 0 12%,rgba(220,24,48,.75) 30%,rgba(120,0,20,.35) 52%,transparent 72%);opacity:0;animation:mnMuzzle .45s ease-out forwards;animation-delay:var(--d)}
.fx-moon .mnFlare{position:absolute;left:50%;top:20%;width:38vmin;height:38vmin;margin:-19vmin;border-radius:50%;
  background:radial-gradient(circle,transparent 46%,rgba(255,40,64,.3) 49%,rgba(160,8,30,.12) 56%,transparent 64%);opacity:0;animation:mnFlare 3.4s ease-out forwards}

.oitem.acted::after{content:"済";position:absolute;top:4px;right:22px;font-size:.6rem;font-weight:800;color:var(--ink-2);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--cloud)}

.oitem .pickGo{position:absolute;right:6px;bottom:6px;z-index:2;padding:2px 10px !important}
.oitem:has(.pickGo) .ostat:last-of-type{padding-right:52px}

@media (prefers-reduced-motion:reduce){ .oitem.tied{animation:none} }
.pickList{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.pickBtn{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--mist);color:var(--ink);font:inherit;font-weight:800;cursor:pointer;text-align:left}
.pickBtn .pt{width:36px;height:36px;border-radius:50%}
.pickBtn small{margin-left:auto;font-size:.7rem;color:var(--ink-2)}
.pickBtn:hover:not(:disabled){border-color:var(--pink)}
.pickBtn:disabled{opacity:.5;cursor:default}

/* round: status line (wide screens) / chip (phones) */
.roundBar{display:flex;align-items:center;gap:2px;width:100%;margin:0 0 4px;padding:3px 8px;border:1px solid var(--line);border-radius:8px;background:var(--cloud);color:var(--ink-2);font:inherit;font-size:.78rem;font-weight:800;text-align:left;cursor:default;white-space:nowrap;overflow:hidden}
.roundBar[data-roundmenu]{cursor:pointer}
.roundBar[data-roundmenu]:hover{border-color:var(--pink)}
.roundBar.on{color:var(--ink)}
.roundBar b{font-family:var(--num);font-size:1.05rem;color:var(--gold);margin:0 2px}
.roundBar .rbTurn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.roundBar .rbTurn i{font-style:normal}
.roundBar .rbMenu{margin-left:auto;padding-left:6px;color:var(--ink-2)}
#mapP .order > .roundBar{grid-column:1 / -1;height:30px;min-height:30px;align-self:start;box-sizing:border-box}
.roundChip{flex:none !important;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:999px;background:var(--cloud);color:var(--ink-2);font:inherit;font-size:.74rem;font-weight:800;white-space:nowrap}
.roundChip.on{color:var(--ink)}
.roundChip b{font-family:var(--num);color:var(--gold);font-size:.95rem;margin:0 1px}
.roundMenu{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.roundMenu .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:8px 14px}
.roundMenu .btn small{font-weight:600;font-size:.74rem;opacity:.8;margin-top:2px}

/* notice under the chat tabs (floats over the log, so nothing moves) */
.chat{position:relative}
.chatNotice{position:absolute;left:12px;right:12px;z-index:5;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;background:#3A2A35;border:1px solid var(--pink);color:#fff;font-size:.82rem;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:pointer;opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s ease,transform .2s ease}
.chatNotice.show{opacity:1;transform:none;pointer-events:auto}
.chatNotice .cnText{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatNotice .cnGo{flex:none;color:var(--pink)}
.chatNotice .qarrow{color:var(--pink)}

/* light theme: names on light cards are darkened instead of outlined (the chat stays dark, its names are unchanged) */
:root[data-theme="light"] :is(.oname,.uname,dialog .mhead h1){color:color-mix(in oklab,var(--nm) 55%,#141A3A) !important;text-shadow:none !important}

/* whose turn it is: a pulsing gold ring on the piece, a glow on the list card, a tag by your hand */
.tok.turn{outline:none !important;box-shadow:0 0 0 3px var(--gold),0 0 12px 3px color-mix(in srgb,var(--gold) 65%,transparent) !important;animation:turnPulse 1.6s ease-in-out infinite;z-index:2}

.oitem.now{box-shadow:inset 0 0 0 2px var(--gold),0 0 14px color-mix(in srgb,var(--gold) 35%,transparent) !important}
.myTurn{flex:none;font-size:.72rem;font-weight:800;color:#2A1C00;background:var(--gold);border-radius:999px;padding:1px 9px;white-space:nowrap;animation:turnTag 1.6s ease-in-out infinite}
@keyframes turnTag{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent)}}

/* cross unison: slanted portrait panels side by side, a flash, the title */
.unRow{position:relative;display:flex;justify-content:center;align-items:stretch;width:min(96vw,1000px);height:min(58vh,460px)}
.unCell{position:relative;flex:1;margin:0 -1.6%;clip-path:polygon(14% 0,100% 0,86% 100%,0 100%);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff),color-mix(in srgb,var(--c) 60%,#0A0D1E));
  opacity:0;transform:translateX(70vw);animation:unIn 3.4s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 110ms)}
.unCell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}
.unCell::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 60%,#fff),inset 0 -60px 50px -30px rgba(0,0,0,.6)}
.unName{position:absolute;left:18%;right:18%;bottom:10px;z-index:1;text-align:center;color:#fff;font-weight:800;font-size:clamp(.7rem,2.4vw,1rem);text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unStreak{position:absolute;inset:-20%;background:repeating-linear-gradient(115deg,transparent 0 40px,rgba(255,255,255,.07) 40px 44px);opacity:0;animation:unStreak 3.4s linear forwards}
.unFlash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0%,rgba(255,255,255,.6) 30%,transparent 65%);opacity:0;animation:unFlash 3.4s ease-out forwards}
.fx-unison .unText{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);animation:unText 3.4s ease-out forwards}
.fx-unison .unText b{font-size:clamp(2rem,8vw,4.6rem);letter-spacing:.14em;color:#fff;text-shadow:0 0 18px #FF5C96,0 0 4px #000,0 3px 0 #000}
.fx-unison .unText span{color:#fff;text-shadow:0 1px 4px #000}
@keyframes unIn{0%{opacity:0;transform:translateX(70vw) skewX(-8deg)}16%{opacity:1;transform:none}82%{opacity:1;transform:none}100%{opacity:0;transform:translateX(-50vw) skewX(-8deg)}}
@keyframes unStreak{0%{opacity:0;transform:translateX(-10%)}20%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(10%)}}
@keyframes unFlash{0%,34%{opacity:0}40%{opacity:.95}58%{opacity:0}100%{opacity:0}}
@keyframes unText{0%,38%{opacity:0;transform:translateY(-50%) scale(1.25)}46%{opacity:1;transform:translateY(-50%) scale(1)}84%{opacity:1;transform:translateY(-50%) scale(1)}100%{opacity:0;transform:translateY(-50%) scale(.98)}}
.fx-unison.fx-simple .unCell{animation:fxFade 3.4s ease forwards;transform:none}
.fx-unison.fx-simple .unStreak,.fx-unison.fx-simple .unFlash{display:none}
.fx-unison.fx-simple .unText{animation:fxFade 3.4s ease forwards;opacity:1}

/* turn cut-in: a slanted band in the character's colour sweeps through (gold when it is yours) */
.fx-turn .tnBand{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;width:130vw;padding:14px 0;

.fx-turn .tnBand > *{transform:skewY(4deg)}
.fx-turn.mine .tnBand{background:linear-gradient(90deg,transparent,#B8860B 22%,#FFC94D 50%,#B8860B 78%,transparent);border-color:#FFE7A0}
.tnPt{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #fff;box-shadow:0 0 16px var(--fxc);background:var(--fxc)}
.tnPt.none{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.6rem;color:#fff}

@keyframes tnBand{0%{opacity:0;transform:skewY(-4deg) translateX(-55vw)}18%{opacity:1;transform:skewY(-4deg) translateX(0)}78%{opacity:1;transform:skewY(-4deg) translateX(0)}100%{opacity:0;transform:skewY(-4deg) translateX(55vw)}}

@media (max-width:720px){
  #mapP .mapwrap{display:grid !important;grid-template-columns:46px minmax(0,1fr) !important;grid-template-rows:auto auto;gap:6px !important;align-items:stretch}

  /* tool row above: the buttons, or "moving …" while a piece is picked up (same height either way) */

  /* the column is exactly as tall as the board and scrolls inside */

  .ordToggle{display:block;flex:none;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--cloud);color:var(--ink-2);font-weight:800;font-size:.8rem;cursor:pointer;padding:0}

  .oitem{padding:5px 6px 5px 8px !important;min-width:0;flex:none}

  .ostat .bar{height:5px;border-radius:3px;margin-left:2px}
  #mapP .order > .grp{font-size:.62rem;margin:4px 0 0;text-align:center}

  .mapwrap:not(.ordOpen) .oitem{padding:4px 3px 4px 4px !important;border-left-width:2px}

  .mapwrap:not(.ordOpen) .ohead .pt{width:30px !important;height:30px !important}

  .mapwrap:not(.ordOpen) .oitem.now::after{content:"";top:-3px;right:-3px;width:9px;height:9px;padding:0;border:2px solid var(--cloud)}
  /* hand: one fanned row of fixed height; cards overlap when there are many, and show their corner */
  .tray{padding:8px 10px 10px !important}
  .handHead{flex-wrap:nowrap}
  /* the row never wraps: the name and the turn tag give way first, the buttons keep their size */
  .handHead > *{flex:none}
  .handHead .handName,.handHead .myTurn{flex:0 1 auto;min-width:1.5em;overflow:hidden;text-overflow:ellipsis}
  .handHead .handName{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* narrow: "白雪姫 17枚 手番" instead of "白雪姫の手札 17枚 あなたの手番" */

  #myHand > .muted{align-self:center}
  #myHand .card{flex:none;width:50px;height:72px;align-items:flex-start;justify-content:flex-start;padding:4px 0 0 5px;box-shadow:-2px 0 4px rgba(0,0,0,.25),0 2px 0 rgba(0,0,0,.18)}
  #myHand .card + .card{margin-left:min(6px, calc((100% - var(--n) * 50px) / (var(--n) - 1)))}

<body>
<div id="app"></div>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" hidden></div>
<script>
'use strict';
// =====================================================================
// core: state, actions, visibility
// Everything that changes a room goes through apply(room, action, by).
// Everything a viewer may see goes through the view* functions.
// When moving to a server, these two parts move there unchanged.
// =====================================================================
const SUIT = { S: '♠', C: '♣', H: '♥', D: '♦' };
const RANK = r => ({ 1: 'A', 11: 'J', 12: 'Q', 13: 'K' }[r] || String(r));
const KIND = { attack: '攻撃', evade: '回避', other: 'その他' };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
// copy 1 uses plain ids (S7); extra decks get a suffix (S7#2) so every card stays unique
function newDeck(jokers, copies = 1) {
  const d = [];
  for (let k = 1; k <= copies; k++) {
    const tag = k === 1 ? '' : '#' + k;
    for (const s of 'SCHD') for (let r = 1; r <= 13; r++) d.push(s + r + tag);
    for (let i = 1; i <= jokers; i++) d.push('X' + i + tag);
  }
  return shuffle(d);
}
const cardOf = c => c[0] === 'X' ? { joker: true } : { s: c[0], r: parseInt(c.slice(1), 10) };
const cardText = c => { const k = cardOf(c); return k.joker ? 'JOKER' : SUIT[k.s] + RANK(k.r); };
function sortCards(cards, mode) {
  const so = { S: 0, C: 1, H: 2, D: 3 };
  return [...cards].sort((a, b) => {
    const x = cardOf(a), y = cardOf(b);
    if (x.joker || y.joker) return (x.joker ? 1 : 0) - (y.joker ? 1 : 0) || a.localeCompare(b);
    return mode === 'rank' ? (x.r - y.r || so[x.s] - so[y.s]) : (so[x.s] - so[y.s] || x.r - y.r);
  });
}

// Dropbox share link -> direct image link
function toDirectImage(url) {
  const s = (url || '').trim();
  try {
    const u = new URL(s);
    if (/(^|\.)dropbox\.com$/.test(u.hostname)) { u.searchParams.delete('dl'); u.searchParams.set('raw', '1'); }
    return u.toString();
  } catch (e) { return s; }
}

// ----- character import format (pw-character v2, v1 also accepted) -----
const SLOT_SUITS = ['S', 'C', 'H', 'D'];
// name colours chosen to stay readable on the black chat
const NAME_COLORS = ['#5DADEC', '#FF6B9A', '#4FD1A5', '#FFB547', '#B48CFF', '#7C8CFF', '#FF8A5C', '#E6E66A', '#FF7A7A', '#FFFFFF', '#9BE15D', '#F28CD8'];
const isHex = s => typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s);
const STAT_KEYS = ['HP', 'TP', 'SS値', '移動値'];
function normalizeChar(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('JSONの形になっていません');
  if (raw.format && raw.format !== 'pw-character') throw new Error(`形式が違います（${raw.format}）`);
  if (!raw.name || typeof raw.name !== 'string') throw new Error('name（キャラクター名）がありません');
  const item = x => ({ name: String(x?.name || ''), attrs: x?.attrs && typeof x.attrs === 'object' ? x.attrs : {}, text: String(x?.text || '') });
  // values: {HP:{max:20}} / {SS値:{value:3}} / {HP:20} (shorthand = max for HP/TP, value otherwise)
  const stats = {};
  for (const [k, v] of Object.entries(raw.values || {})) {
    // empty (null / "") means the character does not have that value, not 0
    const n = x => x != null && x !== '' && Number.isFinite(Number(x));
    if (v && typeof v === 'object') {
      if (n(v.max)) stats[k] = { max: Number(v.max) };
      else if (n(v.value)) stats[k] = { value: Number(v.value) };
    } else if (n(v)) stats[k] = (k === 'HP' || k === 'TP') ? { max: Number(v) } : { value: Number(v) };
  }
  // weapons: {common:[2], slots:[4 by suit]}; a v1 array becomes common weapons
  const w = raw.weapons;
  const slotsFrom = arr => {
    const out = SLOT_SUITS.map(s => ({ suit: s, ...item(null) }));
    (Array.isArray(arr) ? arr : []).forEach((x, i) => {
      const s = SLOT_SUITS.includes(x?.suit) ? x.suit : SLOT_SUITS[i];
      if (s) out[SLOT_SUITS.indexOf(s)] = { suit: s, ...item(x) };
    });
    return out;
  };
  const weapons = Array.isArray(w) ? { common: w.map(item), slots: slotsFrom([]) }
    : { common: Array.isArray(w?.common) ? w.common.map(item) : [], slots: slotsFrom(w?.slots) };
  // 特殊機能 may sit in core.functions or at the top level (functions)
  const fnSrc = Array.isArray(raw.core?.functions) ? raw.core.functions : Array.isArray(raw.functions) ? raw.functions : [];
  const core = raw.core || fnSrc.length ? { ...item(raw.core || { name: '' }), functions: fnSrc.map(item) } : null;
  const data = {
    format: 'pw-character', version: 2,
    name: raw.name, player: String(raw.player || ''),
    core, stats,
    // tp: TP consumed when the 特技 is used (cost is accepted as an older name)
    skills: Array.isArray(raw.skills) ? raw.skills.map(x => { const t = x?.tp ?? x?.cost; return { ...item(x), tp: t != null && Number.isFinite(Number(t)) ? Number(t) : null }; }) : [],
    weapons,
    // portrait: the 立ち絵 (by label) the character switches to when changing into that variation; basePortrait for 基本
    variations: Array.isArray(raw.variations) ? raw.variations.map(v => ({ name: String(v?.name || 'バリエーション'), slots: slotsFrom(v?.slots), portrait: v?.portrait ? String(v.portrait) : null })) : [],
    basePortrait: raw.basePortrait ? String(raw.basePortrait) : null,
    wingDrive: raw.wingDrive ? item(raw.wingDrive) : null,
    // enemies: any number of ダークドライブ (an enemy's counterpart of the ウイングドライブ), each with its own TP cost
    darkDrives: (Array.isArray(raw.darkDrives) ? raw.darkDrives : []).map(x => { const t = x?.tp; return { ...item(x), tp: t != null && t !== '' && Number.isFinite(Number(t)) ? Number(t) : null }; }).filter(x => x.name),
    // 巨大キャラクター: takes 2×2 squares on the board (x, y = its top-left square on screen)
    size: Number(raw.size) === 2 ? 2 : 1,
    // enemies: what the change of variation is called — 'morph' (メタモルフォーゼ) or 'swap' (換装); unset = decided by the weapons
    formStyle: raw.formStyle === 'morph' || raw.formStyle === 'swap' ? raw.formStyle : null,
    // {label, url}; a plain URL string (older sheets) gets a numbered label
    portraits: Array.isArray(raw.portraits) ? raw.portraits.map((p, i) => typeof p === 'string' ? { label: `立ち絵${i + 1}`, url: p } : p)
      .filter(p => p && typeof p.url === 'string' && p.url.trim()).map(p => ({ label: String(p.label || '立ち絵'), url: toDirectImage(p.url) })) : [],
    memo: String(raw.memo || ''),
  };
  dropStaleFormPortraits(data);
  return data;
}
// links to a 立ち絵 that no longer exists are cleared
function dropStaleFormPortraits(d) {
  const labels = new Set(d.portraits.map(p => p.label));
  if (!labels.has(d.basePortrait)) d.basePortrait = null;
  for (const v of d.variations) if (!labels.has(v.portrait)) v.portrait = null;
}
// the 立ち絵 linked to variation i (-1 = 基本), or null
const formPortrait = (ch, i) => (i === -1 ? ch.data.basePortrait : (ch.data.variations[i] || {}).portrait) || null;
const portraitUrl = (ch, label) => (ch.data.portraits.find(p => p.label === label) || {}).url || null;

    case 'shuffleBack': {

    const text = `${names.slice(0, 3).join('、')}${names.length > 3 ? ` ほか${names.length - 3}人` : ''}が入力中`;

// unread counts per tab, tracked by log id: a log read in one tab (e.g. an HP change shown in
// both メイン and 戦闘) is read everywhere. The open tab counts as read while the chat is on screen.
function computeUnread(room, ru) {
  const v = ru.viewer, key = room.id + ':' + v;
  const chatOnScreen = ru.pane === 'chat' || matchMedia('(min-width:960px)').matches;
  let seen = ui.seenTab[key];
  const lists = {};
  const mine = l => (ONLINE ? l.pid === myPid() : l.by === v);
  for (const t of room.tabs) if (canSeeTab(room, t, v, myPid())) lists[t.id] = logsForTab(room, t.id).filter(l => !mine(l) && viewLog(room, l, v, myPid()));
  if (!seen) { seen = ui.seenTab[key] = new Set(); Object.values(lists).forEach(list => list.forEach(l => seen.add(l.id))); }
  if (chatOnScreen && lists[ru.tab]) lists[ru.tab].forEach(l => seen.add(l.id));
  ui.unread = {}; const ids = new Set();
  for (const [tid, list] of Object.entries(lists)) {

    <div class="row" style="margin-top:14px"><span style="flex:1"></span><button class="btn" data-close>やめる</button>
    <button class="btn ${danger ? 'dangerFill' : 'primary'}" id="askOk">${esc(okLabel)}</button></div>`, () => {
    $('askOk').onclick = () => { closeDlg(); onOk(); };
    $('askOk').focus();
  });

// 武装を使う: pick any number of weapons, the cards to discard and the targets in one go
// 同時使用: weapons used together are paid with cards of the same number, one per weapon in its suit.
// Returns the numbers that can still make the set from this hand (narrowed by the cards already chosen), or null for a single suited weapon.
function comboOf(picked, hand, chosen) {
  const need = {};
  picked.forEach(([, x]) => { if (x.suit) need[x.suit] = (need[x.suit] || 0) + 1; });
  const n = Object.values(need).reduce((a, b) => a + b, 0);
  if (n < 2) return null;
  const have = {};   // "S7" → how many in hand
  hand.forEach(c => { const k = cardOf(c); if (!k.joker) have[k.s + k.r] = (have[k.s + k.r] || 0) + 1; });
  const fixed = [...new Set(chosen.map(cardOf).filter(k => !k.joker && need[k.s]).map(k => k.r))];
  const all = [...new Set(hand.map(cardOf).filter(k => !k.joker).map(k => k.r))].sort((a, b) => a - b)
    .filter(r => Object.entries(need).every(([s, m]) => (have[s + r] || 0) >= m));
  const done = fixed.length === 1 && Object.entries(need).every(([s, m]) => chosen.filter(c => c[0] === s && cardOf(c).r === fixed[0]).length >= m);
  return { need, n, ranks: fixed.length > 1 ? [] : fixed.length ? all.filter(r => r === fixed[0]) : all, all, fixed, done };
}

  if (cb.done) return `<div class="comboBar ok">✓ ${suits} が ${RANK(cb.fixed[0])} でそろいました</div>`;
  if (!cb.ranks.length) return `<div class="comboBar ng">${suits} を同じ数字でそろえられる手札がありません</div>`;
  return `<div class="comboBar">同じ数字で ${suits}：${cb.ranks.map(r => `<button class="btn small comboGo" data-wcombo="${r}" title="${RANK(r)}で${suits}をそろえて選ぶ">${RANK(r)}</button>`).join('')}<span class="muted">押すとそろえて選びます</span></div>`;
}

function weaponClick(t, room, ru) {

  if ((el = t.closest('[data-wcard]'))) { w.cards = tog(w.cards, el.dataset.wcard); refreshModal(); return true; }
  if ((el = t.closest('[data-wcombo]'))) {

    const r = +el.dataset.wcombo, ch = room.chars[w.cid], seat = isPcSeat(room, ch.id) ? ch.id : 'gm';
    const hand = viewHand(room, seat, ru.viewer) || [];

    const suitOf = k => k[0] === 'c' ? ch.data.weapons.common[+k.slice(1)]?.suit : formSlots[+(k[0] === 'v' ? k.split('_')[1] : k.slice(1))]?.suit;
    const keep = w.cards.filter(c => { const k = cardOf(c); return k.joker || !w.weapons.some(x => suitOf(x) === k.s); });
    const used = new Set(keep), pickN = [];

function bindRoomStatic() {
  $('viewer').onchange = e => {
    const room = curRoom(), ru = roomUI(room.id);
    ru.as = null; ui.sel = []; ui.selTok = null; ui.cmd = null;
    if (ONLINE) { netJoin(room.id, e.target.value); return; }   // the server decides the seat
    ru.viewer = e.target.value; renderRoom();
  };

  $('setBtn').onclick = () => settingsDialog(curRoom());
  $('undoBtn').onclick = () => {
    const prev = ui.history.pop(); if (!prev) return;
    const r = JSON.parse(prev); DB.rooms[r.id] = r; persist(); renderRoom(); toast('1つ前の状態に戻しました');
  };
  $('asSel').onchange = e => { roomUI(curRoom().id).as = e.target.value; renderRoom(); };
  $('ptSel').onchange = e => { const ru = roomUI(curRoom().id); act({ type: 'setPortrait', cid: ru.as, label: e.target.value }); };
  $('freeName').oninput = e => { roomUI(curRoom().id).name = e.target.value; saveU(); };
  // ":HP-10", ":TP+2", ":HP=30" (several separated by spaces) change the speaking character's values
  const statCmd = (room, ru, text) => {
    const toks = text.normalize('NFKC').trim().split(/\s+/);
    if (!toks.length || !toks.every(t => /^:[^+\-=:]+[+\-=]-?\d+$/.test(t))) return false;
    const c = room.chars[ru.as];
    if (!c) { toast('数値を変えるキャラを発言者に選んでください'); return true; }
    const alias = k => { const u = k.toUpperCase(); if (u === 'HP' || u === 'TP') return u; if (/^SS/i.test(k)) return 'SS値'; if (/^移動/.test(k)) return '移動値'; return k; };
    let cur = { ...c.cur };
    for (const t of toks) {
      const m = t.match(/^:([^+\-=:]+)([+\-=])(-?\d+)$/);
      const key = alias(m[1]);
      if (!(key in cur)) { toast(`${c.data.name}には「${m[1]}」がありません`); return true; }
      const n = +m[3];
      const v = m[2] === '=' ? n : cur[key] + (m[2] === '+' ? n : -n);
      if (act({ type: 'setValue', cid: c.id, key, value: v }) === FAIL) return true;
      cur[key] = v;
    }
    $('sayText').value = ''; $('sayText').blur();
    return true;
  };
  const send = () => {
    const room = curRoom(), ru = roomUI(room.id), text = $('sayText').value;
    if (!text.trim()) return;
    if (statCmd(room, ru, text)) return;
    let c = room.chars[ru.as];
    // speaking under the player name with a 「」 line: it is the character speaking
    if (!c && U.speechAs !== false && isPcSeat(room, ru.viewer) && speechParts(text)) c = room.chars[ru.viewer];
    const cmd = ui.cmd && c && ui.cmd.cid === c.id ? ui.cmd : null;
    // a character without TP (enemies often have none) just declares it
    const spend = cmd && cmd.tp && Number.isFinite(c.cur.TP) ? cmd.tp : null;
    const r = act({ type: 'say', tab: ru.tab, as: c ? c.id : null, name: c ? null : ($('freeName').value.trim() || seatName(room, ru.viewer)), color: c ? null : (ru.freeColor || null), portrait: c ? c.portrait : null, text,
      cmd: cmd ? cmd.name : null, spendTP: Number.isFinite(spend) ? spend : null, fx: cmd && cmd.fx ? cmd.fx : undefined, reply: ui.reply ? ui.reply.id : undefined });
    if (r !== FAIL) { $('sayText').value = ''; ui.cmd = null; ui.reply = null; $('sayText').blur(); renderRoom(); }
  };
  $('sayBtn').onclick = send;
  $('palBtn').onclick = () => openModal('cmd');
  $('colorBtn').onclick = () => {
    const room = curRoom(), ru = roomUI(room.id), c = room.chars[ru.as];
    if (c) colorDialog(c.color, col => act({ type: 'setColor', cid: c.id, color: col }));
    else colorDialog(ru.freeColor, col => { ru.freeColor = col; saveU(); renderRoom(); });
  };
  $('cmdClear').onclick = () => { ui.cmd = null; $('sayText').value = ''; renderRoom(); };
  $('replyClear').onclick = () => { ui.reply = null; renderRoom(); };
  $('sayText').addEventListener('input', typingInput);
  $('sayText').addEventListener('input', updateSayAs);
  $('sayText').addEventListener('blur', () => typingOff());
  $('sayText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } });
  $('copyLog').onclick = async () => {
    const room = curRoom(), ru = roomUI(room.id);
    const text = logsForTab(room, ru.tab).map(l => viewLog(room, l, ru.viewer, myPid())).filter(Boolean).map(l => logPlain(room, l)).join('\n');
    try { await navigator.clipboard.writeText(text); toast('ログをコピーしました'); } catch (e) { toast('コピーできませんでした'); }
  };
}

// card / character actions, shared by the page and the modals
function commonClick(t, room, ru) {
  const q = s => t.closest(s);
  let el;
  // cards
  if ((el = q('[data-pick]'))) { const c = el.dataset.pick; ui.sel = ui.sel.includes(c) ? ui.sel.filter(x => x !== c) : [...ui.sel, c]; renderCards(room, ru); return true; }

    if (act({ type: 'play', cards, kind: el.dataset.play, memo, seat: handSeat(room, ru) }, { silent: true }) !== FAIL) { ui.sel = []; ui.memo = ''; }
    renderRoom(); return true;
  }
  if ((el = q('[data-drawstep]'))) { ui.drawN = Math.max(1, Math.min(20, ui.drawN + +el.dataset.drawstep)); renderCards(room, ru); return true; }
  if (q('[data-draw]')) { act({ type: 'draw', n: ui.drawN, seat: handSeat(room, ru) }); return true; }
  if (q('[data-rounddraw]')) { act({ type: 'roundDraw', seat: handSeat(room, ru) }); return true; }
  if (q('[data-trade]')) { tradeDialog(room, ru); return true; }
  if ((el = q('[data-handseat]'))) { ru.handSeat = el.dataset.handseat; renderCards(room, ru); return true; }
  if (q('[data-shuffleback]')) { act({ type: 'shuffleBack' }); return true; }

  if (q('[data-resetdeck]')) { ask(`全員の手札と捨て札を回収し、${room.settings.decks || 1}組で山札を作り直します。`, '山札を作り直す', () => act({ type: 'resetDeck' }), true); return true; }
